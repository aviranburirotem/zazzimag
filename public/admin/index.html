<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Zazzi Console</title>
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/site.css?v=2">
<style>
  /* Console: two-pane editor (form left, live article preview right); list view of all articles. */
  body{background:var(--soft)}
  .c-top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .c-top .wrap{display:flex;align-items:center;gap:14px;padding-block:8px}
  .c-top .logo img{width:44px;height:44px}
  .c-title{font-style:italic;font-weight:900;font-stretch:75%;font-size:22px;text-transform:uppercase}
  .c-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .b{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);padding:8px 12px;border-radius:4px;font-size:13px;font-weight:600}
  .b:hover{border-color:var(--fg)}
  .b.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .b.dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
  .b.danger{color:var(--accent)}
  .b[disabled]{opacity:.5;cursor:default}
  .b .ic{width:16px;height:16px}
  .c-tabs{display:flex;gap:4px;margin-left:8px}
  .c-tabs button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:8px 12px;border-radius:4px;font-size:13px;font-weight:600;color:var(--muted)}
  .c-tabs button[aria-current="page"]{background:var(--soft);color:var(--fg)}
  .c-tabs .ic{width:16px;height:16px}
  @media (max-width:700px){.c-title{display:none}.c-actions .b span{display:none}}
  .texts{display:grid;gap:16px;max-width:820px}
  .texts fieldset{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:18px 20px 20px;margin:0;display:grid;gap:14px}
  .texts legend{font-style:italic;font-weight:900;font-stretch:75%;font-size:20px;text-transform:uppercase;padding:0 6px}
  .texts input,.texts textarea{width:100%}
  .texts textarea{min-height:90px}
  .texts .def{background:none;border:0;padding:0;font-size:12px;color:var(--muted);text-decoration:underline;justify-self:start}
  .texts .f{display:grid;gap:6px}
  .texts-bar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--bg);border:1px solid var(--line);border-radius:6px;max-width:820px;margin-top:16px}
  .prods{display:grid;gap:12px;max-width:900px}
  .prod{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:16px;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:6px;align-items:start}
  .prod.hidden-p{opacity:.6}
  .prod .pthumb{width:120px;aspect-ratio:4/5;border:1px dashed var(--line);border-radius:4px;background:var(--soft) center/cover;display:grid;place-items:center;color:var(--muted);padding:0}
  .prod .pthumb .ic{width:26px;height:26px}
  .prod .pf{display:grid;gap:10px;min-width:0}
  .prod .pf input:not([type=checkbox]),.prod .pf textarea,.prod .pf select{width:100%}
  .prod .switch{justify-self:start}
  .prod .pf textarea{min-height:64px}
  .prod .pctl{display:grid;gap:6px}
  .prod .pctl .b{justify-content:center;padding:7px}
  .three{display:grid;grid-template-columns:1fr 170px 170px;gap:10px;align-items:end}
  @media (max-width:760px){.prod{grid-template-columns:90px minmax(0,1fr)}.prod .pthumb{width:90px}.prod .pctl{grid-column:1/-1;display:flex}.three{grid-template-columns:1fr 1fr}}
  .ig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:1100px}
  .ig-item{position:relative;display:grid;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;cursor:pointer}
  .ig-item img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:3px;background:var(--soft);transition:filter .2s,opacity .2s}
  .ig-item .cap{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
  .ig-item .row2{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .ig-item .pill{cursor:pointer}
  .ig-item input{position:absolute;opacity:0;pointer-events:none}
  .ig-item.is-hidden img{filter:grayscale(1);opacity:.35}
  .ig-item.is-hidden{border-style:dashed}
  .ig-item:focus-within{outline:2px solid var(--accent);outline-offset:2px}
  .pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:8px}
  .page-card{display:grid;gap:6px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
  .page-card img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fbfaf7;border-radius:3px}
  .page-card .pc-top{display:flex;justify-content:space-between;align-items:center}
  .page-card .pc-ctl{display:flex;gap:4px}
  .page-card .pc-ctl .b{padding:5px}
  .page-card input{width:100%;font-size:13px;padding:8px}
  .page-card label{font-size:12px}
  .add-pages{display:grid;place-items:center;gap:6px;min-height:200px;border:1.5px dashed var(--line);border-radius:6px;background:none;color:var(--muted);font-weight:600}
  .add-pages:hover{border-color:var(--fg);color:var(--fg)}
  .add-pages .ic{width:28px;height:28px}
  .vis{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px 3px 7px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:none}
  .vis .ic{width:13px;height:13px}
  .vis.on{background:#e7f6ec;border-color:#bfe5cb;color:#1d6b36}
  .vis.off{background:#f1f1f3;border-color:#d9d9de;color:#5b5e66}
  .vis:hover:not(:disabled){border-color:currentColor}
  .photo-row.is-hidden img,.page-card.is-hidden img{opacity:.35;filter:grayscale(1)}
  .photo-row.is-hidden,.page-card.is-hidden{border-style:dashed}
  .showbox{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
  .showbox input{width:16px!important;height:16px;accent-color:var(--accent)}
  .panel{background:var(--bg);border:1px solid var(--line);border-radius:6px}
  main.c{padding-block:24px 64px}

  /* login */
  .login{max-width:380px;margin:12vh auto 0;padding:28px;display:grid;gap:14px;text-align:center}
  .login img{width:120px;height:120px;margin:0 auto}
  .login h1{margin:0;font-style:italic;font-weight:900;font-stretch:70%;font-size:34px;text-transform:uppercase}
  .login form{text-align:left}

  /* list */
  .list-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .list-head h1{margin:0;font-style:italic;font-weight:900;font-stretch:70%;font-size:40px;text-transform:uppercase;line-height:1}
  .rows{display:grid;gap:8px}
  .row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
  .row img,.row .noimg{width:64px;height:80px;object-fit:cover;background:var(--soft);border-radius:3px}
  .row h3{margin:0 0 4px;font-size:16px;font-weight:700;font-stretch:85%}
  .row .meta-l{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pill{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px;border:1px solid var(--line)}
  .pill.live{background:#e7f6ec;border-color:#bfe5cb;color:#1d6b36}
  .pill.draft{background:#fff4e0;border-color:#f3d9a6;color:#8a5a00}
  .row-actions{display:flex;gap:6px}
  @media (max-width:640px){.row{grid-template-columns:52px minmax(0,1fr)}.row img,.row .noimg{width:52px;height:66px}.row-actions{grid-column:1/-1}}

  /* editor */
  .editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  @media (max-width:980px){.editor{grid-template-columns:1fr}}
  .form{padding:20px;display:grid;gap:14px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:520px){.two{grid-template-columns:1fr}}
  .hint{font-weight:400;color:var(--muted);font-size:12px}
  .slug-row{display:flex;align-items:center;border:1px solid var(--line);border-radius:2px;overflow:hidden}
  .slug-row span{padding:11px 0 11px 12px;color:var(--muted);font-family:var(--mono);font-size:12px;white-space:nowrap}
  .slug-row input{border:0;flex:1;min-width:0;font-family:var(--mono);font-size:13px;padding-left:2px}
  .cover-box{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:start}
  .cover-box .thumb{width:110px;aspect-ratio:4/5;background:var(--soft) center/cover;border:1px dashed var(--line);border-radius:4px;display:grid;place-items:center;color:var(--muted)}
  .cover-box .thumb .ic{width:26px;height:26px}
  .tb{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border:1px solid var(--line);border-bottom:0;border-radius:2px 2px 0 0;background:var(--soft)}
  .tb button{display:grid;place-items:center;width:34px;height:32px;border:0;background:none;border-radius:3px}
  .tb button:hover{background:var(--bg)}
  .tb .ic{width:17px;height:17px}
  .tb .sep{width:1px;background:var(--line);margin:4px}
  .tb .wide{width:auto;padding:0 10px;display:inline-flex;gap:6px;font-size:12px;font-weight:600}
  #ed input:not([type=checkbox]),#ed textarea,#ed select{width:100%}
  #body{min-height:420px;font-family:var(--mono);font-size:13px;line-height:1.6;border-radius:0 0 2px 2px}
  .switch{display:flex;align-items:center;gap:10px;font-weight:600}
  .switch input{width:18px;height:18px;accent-color:var(--accent)}
  .save-bar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--bg);border-top:1px solid var(--line);border-radius:0 0 6px 6px;margin:6px -20px -20px}
  .status{font-size:13px;color:var(--muted)}
  .status.err{color:var(--accent)}
  .status.ok{color:#1d6b36}
  .preview{padding:0 0 24px;overflow:hidden}
  .preview .pv-label{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
  .preview .article-head{padding:24px 20px 0}
  .preview .article-head h1{font-size:clamp(28px,4vw,46px)}
  .preview .hero{margin:20px 20px 0;max-width:none}
  .preview .hero.vertical{max-width:380px;margin-left:auto;margin-right:auto}
  .preview .hero.vertical .ph{aspect-ratio:4/5}
  .shape-pick{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
  .preview .body{margin:24px 20px 0;font-size:17px}
  .uploading{display:flex;gap:8px;flex-wrap:wrap}
  .photos{display:grid;gap:10px;margin-top:14px}
  .photos:empty{display:none}
  .photo-row{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:4px}
  .photo-row img{width:84px;height:105px;object-fit:cover;border-radius:3px;background:var(--soft)}
  .photo-row .fields{display:grid;gap:8px}
  .photo-row .num{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .confirm{display:flex;gap:6px;align-items:center;font-size:13px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
/* cover position (left panel): two separate positions, each with its own preview */
.pos-box{display:grid;gap:16px;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:8px}
.pos-box[hidden]{display:none}
.pos-sec{display:grid;gap:10px}
.pos-sec+.pos-sec{border-top:1px solid var(--line);padding-top:16px}
.pos-sec-h{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.pos-sec-h strong{font-size:13px}
.pos-frame{overflow:hidden;background:var(--soft);cursor:grab;touch-action:none;user-select:none;position:relative}
.pos-frame.dragging{cursor:grabbing}
.pos-frame img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.pos-ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pos-ctl .b{min-width:40px;justify-content:center}
.pos-hero{position:relative}
.pos-ui{position:absolute;left:10px;bottom:10px;display:flex;gap:4px;background:rgba(0,0,0,.55);padding:4px;border-radius:999px}
.pos-ui button{all:unset;cursor:pointer;color:#fff;min-width:30px;height:30px;border-radius:999px;display:grid;place-items:center;font:600 12px/1 Archivo,system-ui,sans-serif}
.pos-ui button.txt{padding:0 10px}
.pos-ui button:hover{background:rgba(255,255,255,.18)}
.pos-ui button:focus-visible{outline:2px solid #fff}
.pos-ui .ic{width:16px;height:16px}
.pos-hint{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font:600 11px/1 Archivo,system-ui,sans-serif;padding:7px 10px;border-radius:999px;pointer-events:none}
.mh-grid{display:grid;grid-template-columns:2fr 1fr;gap:10px;align-items:start}
.mh-col{display:grid;gap:10px}
.mh-tile{display:grid;gap:4px;min-width:0}
.mh-tile .pos-frame{aspect-ratio:4/5}
.mh-tile.big .pos-frame{aspect-ratio:4/5}
.mh-label{font:10px/1.3 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.mh-title{font:700 12px/1.25 Archivo,system-ui,sans-serif}
.mh-tile.big .mh-title{font-size:16px;font-style:italic;font-stretch:75%;font-weight:800;text-transform:uppercase;line-height:1.05}
.mh-follow{aspect-ratio:1;background:#e30613;color:#fff;display:grid;place-items:center;text-align:center;font:italic 800 11px/1.1 Archivo,system-ui,sans-serif}
/* crop dialog */
.row-btns{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.b.sm{padding:5px 10px;font-size:12px;min-height:0}
.crop-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.crop-box{background:var(--bg);border-radius:10px;width:min(980px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.crop-top,.crop-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px}
.crop-top{border-bottom:1px solid var(--line);justify-content:space-between}
.crop-bar{border-top:1px solid var(--line)}
.crop-shapes{display:flex;flex-wrap:wrap;gap:6px}
.crop-shapes .b[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.crop-stage{flex:1;min-height:0;display:grid;place-items:center;padding:16px;background:#1b1b1b;overflow:auto}
.crop-wrap{position:relative;line-height:0;touch-action:none;user-select:none}
.crop-wrap img{max-width:100%;max-height:calc(100vh - 220px);display:block}
.crop-rect{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.55);outline:2px solid #fff;cursor:move;
  background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);background-size:33.333% 33.333%;background-position:-1px -1px}
.crop-rect:focus-visible{outline:3px solid #2b6cff}
.crop-rect i{position:absolute;width:16px;height:16px;background:#fff;border-radius:2px}
.crop-rect i[data-h=nw]{left:-8px;top:-8px;cursor:nwse-resize}.crop-rect i[data-h=se]{right:-8px;bottom:-8px;cursor:nwse-resize}
.crop-rect i[data-h=ne]{right:-8px;top:-8px;cursor:nesw-resize}.crop-rect i[data-h=sw]{left:-8px;bottom:-8px;cursor:nesw-resize}
/* Instagram connection */
.ig-conn{display:grid;gap:10px;padding:16px;max-width:1100px;margin-bottom:16px}
.ig-conn summary{cursor:pointer;font-size:13px;font-weight:600}
.ig-token{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:10px}
.ig-token label{flex:1;min-width:260px;display:grid;gap:4px}
/* Scheduled posts */
.q-top{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1100px;margin-bottom:16px}
.q-card{display:grid;gap:10px;padding:16px;align-content:start}
.q-add{display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-width:1100px;margin-bottom:16px}
.q-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.q-row label{display:flex;gap:6px;align-items:center;font-size:13px}
.q-row select,.q-row input[type=time],.q-row input[type=datetime-local]{width:auto}
.q-logo-row{display:flex;gap:16px;align-items:flex-start}
.q-logo-row canvas{width:120px;height:150px;border-radius:4px;flex:none;background:var(--soft)}
.q-logo-f{display:grid;gap:8px;flex:1}
.q-logo-f label{display:grid;gap:4px;font-size:13px}
.q-logo-f label.showbox{display:flex}
.q-gal{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.q-gal-i{position:relative}
.q-gal-i>button[role=radio],.q-gal-add{width:58px;height:58px;border-radius:8px;border:1px solid var(--line);background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/12px 12px;display:grid;place-items:center;padding:6px;cursor:pointer}
.q-gal-i>button img{max-width:100%;max-height:100%;object-fit:contain}
.q-gal-i.on>button[role=radio]{border:2px solid var(--accent);box-shadow:0 0 0 2px rgba(227,6,19,.15)}
.q-gal-x{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0;cursor:pointer}
.q-gal-x .ic{width:12px;height:12px}
.q-gal-add{background:var(--bg);color:var(--muted);border-style:dashed}
.q-gal-i.confirm-del .q-gal-x{background:var(--accent);color:#fff;border-color:var(--accent)}
#q-list{display:grid;gap:16px;max-width:1100px}
.q-post{display:grid;gap:12px;padding:16px}
.q-post-h{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.q-photos{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.q-ph{margin:0;flex:none;width:150px;display:grid;gap:6px}
.q-ph img{width:150px;height:188px;object-fit:cover;border-radius:4px;background:var(--soft)}
.q-ph figcaption{display:grid;gap:6px}
.q-ticks{display:flex;gap:12px;flex-wrap:wrap}
.q-ph img{object-fit:contain;background:#f3f3f3}
.q-ph-b{display:flex;gap:4px;flex-wrap:wrap}
.q-post textarea{width:100%}
.q-own{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;background:var(--soft);border-radius:6px}
.q-own input[type=datetime-local]{width:auto}
.q-actions .confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.q-history{max-width:1100px;margin-top:28px;display:grid;gap:8px}
.q-h-row{display:flex;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.q-h-cap{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
@media (max-width:800px){.q-top{grid-template-columns:1fr}}
/* tag people */
.tag-wrap{position:relative;line-height:0;cursor:crosshair}
.tag-wrap img{max-width:100%;max-height:calc(100vh - 220px);display:block}
.tag-layer{position:absolute;inset:0}
.tag-pin{position:absolute;transform:translate(-50%,8px);line-height:1;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.8);color:#fff;border-radius:6px;padding:6px 8px;font:600 13px/1 Archivo,system-ui,sans-serif;white-space:nowrap;cursor:default}
.tag-pin::before{content:"";position:absolute;left:50%;top:-6px;margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom-color:rgba(0,0,0,.8)}
.tag-pin input{all:unset;width:130px;color:#fff;font:inherit}
.tag-x{all:unset;cursor:pointer;padding:0 2px;font-size:15px;opacity:.8}
.tag-x:hover{opacity:1}
.b.sm.danger.sure{background:var(--accent);color:#fff;border-color:var(--accent)}
/* category chips */
.cat-pick{display:grid;gap:8px}
.cat-pick .lbl{font-size:13px;font-weight:600}
.cat-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-b{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font:600 12px/1 Archivo,system-ui,sans-serif;cursor:pointer}
.chip-b[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { markdown, frontmatter } from "./markdown.js";
import { icon } from "./icons.js";
import { SCHEMA } from "./site-schema.js";
import { plan, nice, toMs, local, addDays } from "./ig-schedule.js";

const app = document.getElementById("app");
const esc = (s = "") => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slugify = (s) => s.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 70);
const today = () => new Date().toISOString().slice(0, 10);
const KNOWN = ["title", "dek", "date", "category", "cover", "coverPosition", "heroPosition", "heroShape", "coverAlt", "coverCaption", "author", "pinned", "draft"];

async function api(action, { method = "GET", body, query = "" } = {}) {
  const r = await fetch(`/api/admin?action=${action}${query}`, {
    method, credentials: "same-origin",
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await r.json(); } catch {}
  if (r.status === 401 && action !== "login") { renderLogin("Your session ended. Please log in again."); throw new Error("auth"); }
  if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
}

let tab = "articles";
function topBar(extra = "") {
  return `<header class="c-top"><div class="wrap">
    <a class="logo" href="/admin/" aria-label="Console home"><img src="/assets/logo.png" alt=""></a>
    <span class="c-title">Console</span>
    <nav class="c-tabs" aria-label="Console sections">
      <button type="button" data-act="tab-articles" ${tab === "articles" ? 'aria-current="page"' : ""}>${icon("newspaper")}<span>Articles</span></button>
      <button type="button" data-act="tab-issues" ${tab === "issues" ? 'aria-current="page"' : ""}>${icon("book-open")}<span>Issues</span></button>
      <button type="button" data-act="tab-store" ${tab === "store" ? 'aria-current="page"' : ""}>${icon("shopping-bag")}<span>Store</span></button>
      <button type="button" data-act="tab-insta" ${tab === "insta" ? 'aria-current="page"' : ""}>${icon("instagram")}<span>Instagram</span></button>
      <button type="button" data-act="tab-queue" ${tab === "queue" ? 'aria-current="page"' : ""}>${icon("calendar")}<span>Scheduled posts</span></button>
      <button type="button" data-act="tab-video" ${tab === "video" ? 'aria-current="page"' : ""}>${icon("film")}<span>Video</span></button>
      <button type="button" data-act="tab-texts" ${tab === "texts" ? 'aria-current="page"' : ""}>${icon("pencil")}<span>Site texts</span></button>
    </nav>
    <div class="c-actions">${extra}
      <a class="b" href="/preview/" target="_blank" rel="noopener">${icon("eye")}<span>View site</span></a>
      <button class="b" type="button" data-act="logout">${icon("log-out")}<span>Log out</span></button>
    </div></div></header>`;
}

// ---------- login ----------
// Pages protected by the preview password send people here with ?next=/the/page/
const nextPage = (() => { const n = new URLSearchParams(location.search).get("next") || ""; return n.startsWith("/") && !n.startsWith("//") ? n : ""; })();
function goNext() { if (!nextPage) return false; location.replace(nextPage); return true; }

function renderLogin(msg = nextPage ? "Log in to see the full site preview." : "") {
  app.innerHTML = `<main class="wrap"><div class="panel login">
    <img src="/assets/logo.png" alt="Zazzi magazine">
    <h1>Console</h1>
    <form id="login"><label for="pw">Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn alt" type="submit" style="justify-self:stretch;justify-content:center">Log in ${icon("arrow-right")}</button>
    <p class="status ${nextPage && !arguments.length ? "" : "err"}" id="lmsg" ${msg ? "" : "hidden"}>${esc(msg)}</p></form></div></main>`;
  document.getElementById("pw").focus();
  document.getElementById("login").onsubmit = async (e) => {
    e.preventDefault();
    const m = document.getElementById("lmsg");
    m.hidden = true;
    try { await api("login", { method: "POST", body: { password: document.getElementById("pw").value } }); if (!goNext()) renderList(); }
    catch (err) { if (err.message !== "auth") { m.textContent = err.message; m.hidden = false; } }
  };
}

// ---------- show / hide switch used in the lists ----------
const visBtn = (type, slug, hidden) => `<button type="button" class="vis ${hidden ? "off" : "on"}" data-act="toggle-vis" data-type="${type}" data-slug="${esc(slug)}" data-hidden="${hidden ? 1 : 0}" aria-pressed="${!hidden}" title="${hidden ? "Hidden from the site. Click to show it" : "Shown on the site. Click to hide it"}">${icon(hidden ? "eye-off" : "eye")}<span>${hidden ? "Hidden" : "Shown"}</span></button>`;

// ---------- list ----------
let categories = [];
async function renderList(flash = "") {
  tab = "articles";
  app.innerHTML = topBar(`<button class="b primary" type="button" data-act="new">${icon("plus")}<span>New article</span></button>`) +
    `<main class="wrap c"><div class="list-head"><div><span class="label">Articles</span><h1>Your stories</h1></div><p class="status ok" id="flash">${esc(flash)}</p></div><div class="rows" id="rows"><div class="panel empty">Loading articles…</div></div></main>`;
  try {
    const { articles } = await api("list");
    categories = [...new Set(articles.flatMap((a) => (Array.isArray(a.category) ? a.category : [a.category])).filter(Boolean))];
    const rows = document.getElementById("rows");
    if (!articles.length) { rows.innerHTML = `<div class="panel empty">No articles yet. Click <b>New article</b> to write your first one.</div>`; return; }
    rows.innerHTML = articles.map((a) => `<div class="row" data-slug="${esc(a.slug)}">
      ${a.cover ? `<img src="${esc(shown(a.cover))}" alt="" loading="lazy">` : `<div class="noimg"></div>`}
      <div><h3>${esc(a.title)}</h3><div class="meta-l">${visBtn("article", a.slug, a.draft)}${a.pinned ? `<span class="pill live">Pinned</span>` : ""}<span class="label">${esc([].concat(a.category || []).join(", "))} · ${esc(a.date)}</span></div></div>
      <div class="row-actions">
        ${a.draft ? "" : `<a class="b" href="/articles/${esc(a.slug)}/" target="_blank" rel="noopener" aria-label="View">${icon("eye")}</a>`}
        <button class="b" type="button" data-act="edit">${icon("pencil")}<span>Edit</span></button>
        <button class="b danger" type="button" data-act="ask-delete" aria-label="Delete">${icon("trash-2")}</button>
      </div></div>`).join("");
  } catch (err) {
    if (err.message !== "auth") document.getElementById("rows").innerHTML = `<div class="panel empty status err">${esc(err.message)}</div>`;
  }
}

// ---------- editor ----------
let ed = null; // { slug, isNew, data, extras, pending: Map(name -> {sha, url}) }
// Photos saved in this session keep showing from memory while the site republishes (about a minute)
const recent = new Map(); // "/images/articles/slug/name.jpg" -> data URL
const shown = (u) => recent.get(u) || u;

async function openEditor(slug) {
  if (!slug) {
    ed = { slug: "", isNew: true, data: { date: today(), author: "", draft: true }, extras: {}, body: "", pending: new Map() };
    return renderEditor();
  }
  app.innerHTML = topBar() + `<main class="wrap c"><div class="panel empty">Loading…</div></main>`;
  try {
    const { raw } = await api("article", { query: `&slug=${encodeURIComponent(slug)}` });
    const { data, body } = frontmatter(raw);
    const extras = Object.fromEntries(Object.entries(data).filter(([k]) => !KNOWN.includes(k)));
    ed = { slug, origSlug: slug, isNew: false, data, extras, body: body.replace(/^\n+/, ""), pending: new Map() };
    renderEditor();
  } catch (err) { if (err.message !== "auth") renderList(); }
}

function field(id, label, value = "", attrs = "", hint = "") {
  return `<label for="${id}">${label}${hint ? ` <span class="hint">${hint}</span>` : ""}<input id="${id}" value="${esc(value)}" ${attrs}></label>`;
}

function renderEditor() {
  const d = ed.data;
  app.innerHTML = topBar(`<button class="b" type="button" data-act="back">${icon("newspaper")}<span>All articles</span></button>`) + `
  <main class="wrap c"><div class="editor">
    <form class="panel form" id="ed" autocomplete="off">
      <span class="label">${ed.isNew ? "New article" : "Edit article"}</span>
      ${field("f-title", "Title", d.title, "required")}
      <label for="f-slug">Web address <span class="hint">${ed.isNew ? "set automatically from the title" : "follows the title · if it changes, the old link forwards to the new one"}</span>
        <div class="slug-row"><span>zazzimag.com/articles/</span><input id="f-slug" value="${esc(ed.slug)}" pattern="[a-z0-9][a-z0-9\-]*"></div></label>
      <label for="f-dek">Summary <span class="hint">one or two sentences under the headline</span><textarea id="f-dek" style="min-height:70px">${esc(d.dek || "")}</textarea></label>
      <div class="two">
        <div class="cat-pick"><span class="lbl">Categories <span class="hint">choose one or more</span></span>
          <div class="cat-chips" id="f-cats" role="group" aria-label="Categories"></div>
          <input id="f-cat-new" placeholder="Add another category, then press Enter" aria-label="New category" autocomplete="off"></div>
        ${field("f-date", "Date", d.date, 'type="date" required')}
      </div>
      ${field("f-author", "Written by", d.author || "", 'placeholder="Writer\'s name"', "the name shown as “Written by …”")}
      <div><span class="label">Cover photo</span>
        <div class="cover-box" style="margin-top:6px">
          <button type="button" class="thumb" id="cover-pick" aria-label="Choose cover photo" style="${d.cover ? `background-image:url('${esc(imgUrl(d.cover))}')` : ""}">${d.cover ? "" : icon("image-plus")}</button>
          <div style="display:grid;gap:8px">
            <button type="button" class="b" id="cover-btn">${icon("image-plus")}<span>${d.cover ? "Replace cover" : "Upload cover"}</span></button>
            ${field("f-coverAlt", "Describe the photo", d.coverAlt, "", "for screen readers")}
            ${field("f-coverCaption", "Caption / photo credit", d.coverCaption)}
            <div class="shape-pick" role="radiogroup" aria-label="Shape at the top of the article"><span class="hint">Shape at the top of the article</span>
              <label class="showbox"><input type="radio" name="f-heroShape" value="horizontal" ${d.heroShape === "vertical" ? "" : "checked"}> Horizontal</label>
              <label class="showbox"><input type="radio" name="f-heroShape" value="vertical" ${d.heroShape === "vertical" ? "checked" : ""}> Vertical</label></div>
          </div>
        </div>
        <input type="file" id="cover-file" accept="image/*" hidden>
        <div class="pos-box" id="pos-box" hidden></div>
      </div>
      <div>
        <label for="body">Article text</label>
        <div class="tb" role="toolbar" aria-label="Formatting">
          <button type="button" data-md="h2" title="Subheading">${icon("heading-2")}</button>
          <button type="button" data-md="bold" title="Bold">${icon("bold")}</button>
          <button type="button" data-md="italic" title="Italic">${icon("italic")}</button>
          <button type="button" data-md="link" title="Link">${icon("link")}</button>
          <button type="button" data-md="quote" title="Quote">${icon("quote")}</button>
          <button type="button" data-md="list" title="List">${icon("list")}</button>
          <button type="button" data-md="instagram" title="Embed an Instagram post or reel">${icon("instagram")}</button>
          <span class="sep"></span>
          <button type="button" class="wide" id="photo-btn" title="Insert photos">${icon("image-plus")}Add photos</button>
        </div>
        <textarea id="body" spellcheck="true">${esc(ed.body)}</textarea>
        <input type="file" id="photo-file" accept="image/*" multiple hidden>
        <p class="hint" style="margin:6px 0 0">Leave an empty line between paragraphs. Photos added together appear side by side.</p>
        <div class="uploading" id="uploading"></div>
        <div class="photos" id="photos"></div>
      </div>
      <label class="switch"><input type="checkbox" id="f-draft" ${d.draft === true ? "" : "checked"}> Published <span class="hint">untick to keep it as a hidden draft</span></label>
      <label class="switch"><input type="checkbox" id="f-pinned" ${d.pinned === true ? "checked" : ""}> Pin to the top of the home page <span class="hint">stays first even when newer stories are added</span></label>
      <div class="save-bar">
        <button class="b primary" type="submit" id="save">${icon("save")}<span>Save</span></button>
        ${ed.isNew ? "" : `<a class="b" href="/articles/${esc(ed.slug)}/" target="_blank" rel="noopener">${icon("eye")}<span>Open live page</span></a>`}
        <span class="status" id="st"></span>
      </div>
    </form>
    <section class="panel preview" aria-label="Preview"><div class="pv-label label">${icon("eye")}Preview</div><div id="pv"></div></section>
  </div></main>`;

  const $ = (id) => document.getElementById(id);
  const titleEl = $("f-title"), slugEl = $("f-slug"), body = $("body");
  // categories: tap to choose one or more; type a new one and press Enter
  ed.cats = [...new Set([].concat(ed.data.category || []).flatMap((c) => String(c).split(",")).map((c) => c.trim()).filter(Boolean))];
  const drawCats = () => {
    const all = [...new Set([...ed.cats, ...categories, "Street Style", "Trends", "Guide", "History", "Streetwear", "Interview"])];
    $("f-cats").innerHTML = all.map((c) => `<button type="button" class="chip-b" aria-pressed="${ed.cats.includes(c)}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  };
  $("f-cats").onclick = (e) => {
    const b = e.target.closest("[data-cat]"); if (!b) return;
    const c = b.dataset.cat;
    ed.cats = ed.cats.includes(c) ? ed.cats.filter((x) => x !== c) : [...ed.cats, c];
    drawCats(); preview();
  };
  $("f-cat-new").onkeydown = (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const c = e.target.value.replace(/[,\[\]|]/g, " ").replace(/\s+/g, " ").trim().slice(0, 40);
    if (c && !ed.cats.includes(c)) ed.cats.push(c);
    e.target.value = ""; drawCats(); preview();
  };
  drawCats();

  // the address follows the title, unless it was set by hand (to something other than the title)
  let slugTouched = Boolean(ed.slug) && ed.slug !== slugify(titleEl.value);

  titleEl.oninput = () => { if (!slugTouched) setSlug(slugify(titleEl.value)); preview(); };
  slugEl.oninput = () => { slugTouched = true; setSlug(slugify(slugEl.value), true); };
  app.querySelectorAll("#ed input, #ed textarea").forEach((el) => el.addEventListener("input", preview));

  function setSlug(next, keepCaret) {
    const prev = ed.slug;
    ed.slug = next;
    if (!keepCaret || slugEl.value !== next) slugEl.value = next;
    if (prev && prev !== next) { // keep photo links pointing at the right folder
      const a = `/images/articles/${prev}/`, b = `/images/articles/${next}/`;
      body.value = body.value.split(a).join(b);
      if (ed.data.cover) ed.data.cover = ed.data.cover.split(a).join(b);
    }
    preview();
  }

  // formatting toolbar
  app.querySelectorAll("[data-md]").forEach((btn) => btn.onclick = () => {
    const s = body.selectionStart, e = body.selectionEnd, sel = body.value.slice(s, e);
    const kind = btn.dataset.md;
    let text = sel, before = "", after = "";
    if (kind === "bold") { before = after = "**"; text ||= "bold text"; }
    if (kind === "italic") { before = after = "*"; text ||= "italic text"; }
    if (kind === "link") { before = "["; after = "](https://)"; text ||= "link text"; }
    if (kind === "h2") { before = "\n\n## "; after = "\n\n"; text ||= "Subheading"; }
    if (kind === "quote") { before = "\n\n> "; after = "\n\n"; text ||= "Quote"; }
    if (kind === "instagram") {
      const url = (window.prompt("Paste the link of the Instagram post or reel (from Instagram: ··· → Copy link)") || "").trim();
      if (!url) return;
      if (!/^https:\/\/(www\.)?instagram\.com\/([A-Za-z0-9._]+\/)?(p|reel|tv)\/[A-Za-z0-9_-]+/.test(url)) { status("That isn't a link to an Instagram post or reel.", "err"); return; }
      body.setRangeText(`\n\n@[instagram](${url.split("?")[0]})\n\n`, s, e, "end"); body.focus(); preview();
      status("Instagram post added. It shows in the article as a card readers can open.", "ok");
      return;
    }
    if (kind === "list") { text = (sel || "First item\nSecond item").split("\n").map((l) => `- ${l.replace(/^- /, "")}`).join("\n"); before = "\n\n"; after = "\n\n"; }
    body.setRangeText(before + text + after, s, e, "end");
    body.focus(); preview();
  });

  // photos
  $("photo-btn").onclick = () => { if (needSlug()) $("photo-file").click(); };
  $("photo-file").onchange = async (e) => {
    const files = [...e.target.files]; e.target.value = "";
    const lines = [];
    for (const f of files) { const p = await addPhoto(f); if (p) lines.push(`![${p.alt}](${p.url} "")`); }
    if (lines.length) { const at = body.selectionStart; body.setRangeText(`\n\n${lines.join("\n")}\n\n`, at, at, "end"); preview(); renderPhotos(); }
  };
  const pickCover = () => { if (needSlug()) $("cover-file").click(); };
  $("cover-btn").onclick = pickCover; $("cover-pick").onclick = pickCover;
  $("cover-file").onchange = async (e) => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    const p = await addPhoto(f, "cover");
    if (p) { ed.data.cover = p.url; ed.data.coverPosition = ""; ed.data.heroPosition = ""; $("cover-pick").style.backgroundImage = `url('${imgUrl(p.url)}')`; $("cover-pick").innerHTML = ""; if (!$("f-coverAlt").value) $("f-coverAlt").value = p.alt; drawPos(); preview(); }
  };

  // ---- cover position: two separate positions ----
  // Home page (coverPosition): the box in this panel, with a small copy of the home page.
  // Top of the article (heroPosition): drag the photo in the Preview panel, or use its arrows.
  const setPos = (key, x, y, redraw = true) => {
    x = Math.round(Math.min(100, Math.max(0, x))); y = Math.round(Math.min(100, Math.max(0, y)));
    const [dx, dy] = POS_DEFAULT[key];
    ed.data[key] = x === dx && y === dy ? "" : `${x}% ${y}%`;
    if (redraw) preview(); // preview() also redraws the home box
    else app.querySelectorAll(`[data-key="${key}"] img`).forEach((im) => (im.style.objectPosition = `${x}% ${y}%`));
  };
  let drag = null;
  for (const area of [$("pos-box"), $("pv")]) {
    area.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-pos]"); if (!btn) return;
      const key = btn.closest("[data-sec]").dataset.sec, dir = btn.dataset.pos;
      const [x, y] = posOf(key), S = 5;
      // "Move the photo up" slides the picture up in the frame, showing more of its lower part
      if (dir === "up") setPos(key, x, y + S); if (dir === "down") setPos(key, x, y - S);
      if (dir === "left") setPos(key, x + S, y); if (dir === "right") setPos(key, x - S, y);
      if (dir === "center") setPos(key, ...POS_DEFAULT[key]);
      area.querySelector(`[data-sec="${key}"] [data-pos="${dir}"]`)?.focus(); // redrawn: keep keyboard focus on the same button
    });
    area.addEventListener("pointerdown", (e) => {
      const fr = e.target.closest(".pos-frame"); if (!fr || e.target.closest("button")) return;
      const im = fr.querySelector("img"); if (!im || !im.naturalWidth) return;
      const fw = fr.clientWidth, fh = fr.clientHeight, s = Math.max(fw / im.naturalWidth, fh / im.naturalHeight);
      drag = { fr, key: fr.dataset.key, x0: e.clientX, y0: e.clientY, p: posOf(fr.dataset.key), ox: im.naturalWidth * s - fw, oy: im.naturalHeight * s - fh };
      fr.setPointerCapture(e.pointerId); fr.classList.add("dragging"); e.preventDefault();
    });
    area.addEventListener("pointermove", (e) => {
      if (!drag) return;
      // dragging the photo right shows more of its left side (a lower % across)
      const nx = drag.ox > 0 ? drag.p[0] - ((e.clientX - drag.x0) / drag.ox) * 100 : drag.p[0];
      const ny = drag.oy > 0 ? drag.p[1] - ((e.clientY - drag.y0) / drag.oy) * 100 : drag.p[1];
      setPos(drag.key, nx, ny, false); // move the pictures only while dragging; redraw when you let go
    });
    const endDrag = () => { if (!drag) return; drag.fr.classList.remove("dragging"); drag = null; preview(); };
    area.addEventListener("pointerup", endDrag); area.addEventListener("pointercancel", endDrag);
  }
  drawPos();
  drawPos();

  function needSlug() {
    if (ed.slug) return true;
    status("Add a title first, so the photos have a folder.", "err"); titleEl.focus(); return false;
  }

  $("ed").onsubmit = (e) => { e.preventDefault(); save(); };

  // "Photos in this article": caption/credit and description for every photo in the text
  const box = $("photos");
  let t;
  body.addEventListener("input", () => { clearTimeout(t); t = setTimeout(renderPhotos, 400); });
  box.addEventListener("change", (e) => {
    if (e.target.dataset.show === undefined) return;
    const i = +e.target.dataset.show, show = e.target.checked;
    const m = [...body.value.matchAll(IMG_RE)][i]; if (!m) return;
    const v = body.value, at = m.index;
    body.value = show ? (v[at - 1] === "~" ? v.slice(0, at - 1) + v.slice(at) : v) : (v[at - 1] === "~" ? v : v.slice(0, at) + "~" + v.slice(at));
    renderPhotos(); preview();
  });
  box.addEventListener("click", async (e) => {
    const del = e.target.closest("[data-delphoto]");
    if (del) { // takes the photo (and its caption) out of the article; click twice to confirm
      if (!del.classList.contains("sure")) {
        del.classList.add("sure"); del.querySelector("span").textContent = "Click again to delete";
        setTimeout(() => { if (del.isConnected) { del.classList.remove("sure"); del.querySelector("span").textContent = "Delete"; } }, 4000);
        return;
      }
      const i = +del.dataset.delphoto, m = [...body.value.matchAll(IMG_RE)][i]; if (!m) return;
      const v = body.value, start = v[m.index - 1] === "~" ? m.index - 1 : m.index;
      body.value = (v.slice(0, start).replace(/\n*$/, "") + "\n\n" + v.slice(m.index + m[0].length).replace(/^\n*/, "")).replace(/^\n+/, "");
      renderPhotos(); preview(); status("Photo deleted from the article. Save to apply.", "ok");
      return;
    }
    const u = e.target.closest("[data-uncrop]");
    if (u) {
      const i = +u.dataset.uncrop, m = [...body.value.matchAll(IMG_RE)][i]; if (!m) return;
      const orig = cropMap()[fileOf(m[2])]; if (!orig) return;
      let n = 0;
      body.value = body.value.replace(IMG_RE, (full, alt, src, cap) => (n++ === i ? `![${alt}](${orig}${cap !== undefined ? ` "${cap}"` : ""})` : full));
      renderPhotos(); preview(); status("Back to the original photo. Save to apply.", "ok");
      return;
    }
    const b = e.target.closest("[data-crop]"); if (!b) return;
    const i = +b.dataset.crop, m = [...body.value.matchAll(IMG_RE)][i]; if (!m) return;
    const res = await cropPhoto(imgUrl(m[2]), m[2]); if (!res) return;
    const map = cropMap(); map[fileOf(res.url)] = map[fileOf(m[2])] || m[2]; setCropMap(map); // remember the uncropped photo
    // swap this photo's address in the text for the cropped copy (caption and description stay)
    let n = 0;
    body.value = body.value.replace(IMG_RE, (full, alt, src, cap) => (n++ === i ? `![${alt}](${res.url}${cap !== undefined ? ` "${cap}"` : ""})` : full));
    renderPhotos(); preview(); status("Cropped. Save to apply.", "ok");
  });
  box.addEventListener("input", (e) => {
    if (e.target.dataset.show !== undefined) return;
    const row = e.target.closest(".photo-row"); if (!row) return;
    const i = +row.dataset.i, k = e.target.dataset.k;
    const clean = (v) => v.replace(/\s*\n\s*/g, " ").replace(/"([^"]*)"/g, "\u201c$1\u201d").replace(/"/g, "\u201d");
    let n = 0;
    body.value = body.value.replace(IMG_RE, (full, alt, src, cap = "") => {
      if (n++ !== i) return full;
      const a = k === "alt" ? clean(e.target.value).replace(/[\[\]]/g, "") : alt;
      const c = k === "cap" ? clean(e.target.value) : cap;
      return `![${a}](${src} "${c}")`;
    });
    preview();
  });
  renderPhotos();
  preview();
}

const IMG_RE = /!\[([^\]]*)\]\((\S+?)(?:\s+"([^"]*)")?\)/g;
function renderPhotos() {
  const box = document.getElementById("photos"), body = document.getElementById("body");
  if (!box || !body) return;
  const list = [...body.value.matchAll(IMG_RE)];
  const isHidden = (m) => body.value[m.index - 1] === "~";
  box.innerHTML = list.length ? `<span class="label">Photos in this article</span>` + list.map((m, i) => `
    <div class="photo-row${isHidden(m) ? " is-hidden" : ""}" data-i="${i}">
      <img src="${esc(imgUrl(m[2]))}" alt="">
      <div class="fields"><span class="num">Photo ${i + 1}</span>
        <div class="row-btns"><label class="showbox"><input type="checkbox" data-show="${i}" ${isHidden(m) ? "" : "checked"}> Shown on the site</label>
        <button type="button" class="b sm" data-crop="${i}">${icon("crop")}<span>Crop</span></button>
        ${cropMap()[fileOf(m[2])] ? `<button type="button" class="b sm" data-uncrop="${i}">${icon("rotate-ccw")}<span>Back to original</span></button>` : ""}
        <button type="button" class="b sm danger" data-delphoto="${i}">${icon("trash-2")}<span>Delete</span></button></div>
        <label for="pc-${i}">Caption / photo credit<input id="pc-${i}" data-k="cap" value="${esc(m[3] || "")}" placeholder="e.g. Shibuya, October 2026. Photo: Your Name"></label>
        <label for="pa-${i}">Describe the photo <span class="hint">for screen readers</span><input id="pa-${i}" data-k="alt" value="${esc(m[1] || "")}"></label>
      </div>
    </div>`).join("") : "";
}

function imgUrl(u) { // pending uploads show from memory until they're published
  const m = u && u.match(/^\/images\/articles\/([^/]+)\/(.+)$/);
  const p = m && ed?.pending.get(m[2]);
  if (p) return p.preview;
  // address being changed: photos already on the site are still in the old folder until saving
  if (m && ed?.origSlug && m[1] === ed.slug && ed.slug !== ed.origSlug) return shown(`/images/articles/${ed.origSlug}/${m[2]}`);
  return shown(u);
}

function status(text, kind = "") { const s = document.getElementById("st"); if (s) { s.textContent = text; s.className = `status ${kind}`; } }

async function resize(file, max = 2000) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
  const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg", 0.85);
}

// ---------- crop a photo in the article ----------
// Which original each cropped copy came from, kept with the article (cropOriginals), so a crop can be undone after saving.
const fileOf = (url) => String(url || "").split("?")[0].split("/").pop();
const cropMap = () => { try { return JSON.parse(ed?.extras?.cropOriginals || "{}") || {}; } catch { return {}; } };
const setCropMap = (map) => { if (Object.keys(map).length) ed.extras.cropOriginals = JSON.stringify(map); else delete ed.extras.cropOriginals; };
// Opens the photo with a crop frame (drag inside to move, drag the corners to resize, or pick a shape),
// then uploads the cropped copy like a new photo. The original file is left as it is.
const CROP_SHAPES = [["Free", 0], ["Original", -1], ["1:1", 1], ["4:5", 4 / 5], ["3:4", 3 / 4], ["3:2", 3 / 2], ["16:9", 16 / 9]];
function cropPhoto(src, oldUrl, opts = {}) { // opts: { shapes, title, onData(data) } for other uses (Instagram queue)
  const SHAPES = opts.shapes || CROP_SHAPES;
  return new Promise((resolve) => {
    const dlg = document.createElement("div");
    dlg.className = "crop-modal";
    dlg.innerHTML = `<div class="crop-box" role="dialog" aria-modal="true" aria-label="Crop photo">
      <div class="crop-top"><strong>${esc(opts.title || "Crop photo")}</strong><div class="crop-shapes" role="group" aria-label="Shape">${SHAPES.map(([n], k) => `<button type="button" class="b sm" data-shape="${k}" aria-pressed="${k === 0}">${n}</button>`).join("")}</div></div>
      <div class="crop-stage"><div class="crop-wrap"><img alt="" draggable="false"><div class="crop-rect" tabindex="0" aria-label="Crop area: drag to move, arrow keys to nudge"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div></div></div>
      <div class="crop-bar"><span class="hint" id="crop-size"></span><span class="status" id="crop-st"></span><span style="flex:1"></span>
        <button type="button" class="b" data-c="cancel">Cancel</button><button type="button" class="b primary" data-c="ok">${icon("crop")}<span>Crop</span></button></div></div>`;
    document.body.append(dlg);
    const img = dlg.querySelector("img"), wrap = dlg.querySelector(".crop-wrap"), rect = dlg.querySelector(".crop-rect");
    const st = dlg.querySelector("#crop-st"), sizeEl = dlg.querySelector("#crop-size");
    let r = null, ar = SHAPES[0][1] > 0 ? SHAPES[0][1] : 0, W = 0, H = 0; // r = crop in displayed pixels; W/H = displayed image size
    const done = (v) => { dlg.remove(); document.removeEventListener("keydown", onKey); resolve(v); };
    const draw = () => {
      Object.assign(rect.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px" });
      const s = img.naturalWidth / W; sizeEl.textContent = `${Math.round(r.w * s)} × ${Math.round(r.h * s)} px`;
    };
    const clampR = () => { r.w = Math.min(r.w, W); r.h = Math.min(r.h, H); r.x = Math.min(Math.max(0, r.x), W - r.w); r.y = Math.min(Math.max(0, r.y), H - r.h); };
    const fitShape = () => { // the largest frame of the chosen shape, centred
      if (!ar) { r = { x: W * 0.05, y: H * 0.05, w: W * 0.9, h: H * 0.9 }; return draw(); }
      let w = W, h = w / ar; if (h > H) { h = H; w = h * ar; }
      r = { x: (W - w) / 2, y: (H - h) / 2, w, h }; draw();
    };
    img.crossOrigin = "anonymous";
    img.onload = () => { W = img.clientWidth; H = img.clientHeight; fitShape(); rect.focus(); };
    img.onerror = () => { st.className = "status err"; st.textContent = "This photo can't be opened for cropping. Upload it again to crop it."; };
    img.src = src;
    dlg.querySelector(".crop-shapes").addEventListener("click", (e) => {
      const b = e.target.closest("[data-shape]"); if (!b || !W) return;
      const v = SHAPES[+b.dataset.shape][1];
      ar = v === -1 ? img.naturalWidth / img.naturalHeight : v;
      dlg.querySelectorAll("[data-shape]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      fitShape();
    });
    let drag = null;
    wrap.addEventListener("pointerdown", (e) => {
      if (!r) return;
      const h = e.target.dataset.h, inRect = e.target.closest(".crop-rect");
      if (!h && !inRect) return;
      drag = { h, x0: e.clientX, y0: e.clientY, r0: { ...r } };
      wrap.setPointerCapture(e.pointerId); e.preventDefault();
    });
    wrap.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0, o = drag.r0, MIN = 30;
      if (!drag.h) { r = { ...o, x: o.x + dx, y: o.y + dy }; clampR(); return draw(); }
      // resize from a corner; the opposite corner stays put
      const east = drag.h.includes("e"), south = drag.h.includes("s");
      const ax = east ? o.x : o.x + o.w, ay = south ? o.y : o.y + o.h; // anchor
      let w = Math.max(MIN, east ? o.w + dx : o.w - dx), hgt = Math.max(MIN, south ? o.h + dy : o.h - dy);
      w = Math.min(w, east ? W - ax : ax); hgt = Math.min(hgt, south ? H - ay : ay);
      if (ar) { if (w / hgt > ar) w = hgt * ar; else hgt = w / ar; }
      r = { x: east ? ax : ax - w, y: south ? ay : ay - hgt, w, h: hgt }; draw();
    });
    const end = () => (drag = null);
    wrap.addEventListener("pointerup", end); wrap.addEventListener("pointercancel", end);
    const onKey = (e) => {
      if (e.key === "Escape") return done(null);
      if (document.activeElement !== rect || !r) return;
      const step = e.shiftKey ? 10 : 2, k = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
      if (k) { r.x += k[0]; r.y += k[1]; clampR(); draw(); e.preventDefault(); }
    };
    document.addEventListener("keydown", onKey);
    dlg.addEventListener("click", async (e) => {
      if (e.target === dlg || e.target.closest("[data-c=cancel]")) return done(null);
      if (!e.target.closest("[data-c=ok]") || !r) return;
      const okBtn = e.target.closest("[data-c=ok]"); okBtn.disabled = true; st.className = "status"; st.textContent = "Uploading…";
      try {
        const s = img.naturalWidth / W, sw = r.w * s, sh = r.h * s, scale = Math.min(1, 2000 / Math.max(sw, sh));
        const c = Object.assign(document.createElement("canvas"), { width: Math.round(sw * scale), height: Math.round(sh * scale) });
        const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, r.x * s, r.y * s, sw, sh, 0, 0, c.width, c.height);
        const data = c.toDataURL("image/jpeg", 0.88);
        if (opts.onData) return done(await opts.onData(data));
        const { sha } = await api("upload", { method: "POST", body: { data } });
        const base = (String(oldUrl).split("/").pop() || "photo").replace(/\.[^.]+$/, "").replace(/-crop(-\d+)?$/, "");
        let name = `${base}-crop.jpg`, n = 2;
        while (ed.pending.has(name) || String(oldUrl).endsWith("/" + name)) name = `${base}-crop-${n++}.jpg`;
        ed.pending.set(name, { sha, preview: data });
        done({ url: `/images/articles/${ed.slug}/${name}` });
      } catch (err) {
        okBtn.disabled = false; st.className = "status err";
        st.textContent = err.message === "auth" ? "" : (err.name === "SecurityError" ? "This photo is hosted on another site and can't be cropped here. Download it and upload it again to crop it." : err.message);
      }
    });
  });
}

async function addPhoto(file, prefix = "") {
  const box = document.getElementById("uploading");
  const chip = document.createElement("span"); chip.className = "pill"; chip.textContent = `Uploading ${file.name}…`; box.append(chip);
  try {
    const data = await resize(file);
    const { sha } = await api("upload", { method: "POST", body: { data } });
    const base = slugify(file.name.replace(/\.[^.]+$/, "")) || "photo";
    let name = `${prefix ? prefix + "-" : ""}${base}.jpg`, n = 2;
    while (ed.pending.has(name)) name = `${prefix ? prefix + "-" : ""}${base}-${n++}.jpg`;
    ed.pending.set(name, { sha, preview: data });
    chip.remove();
    return { url: `/images/articles/${ed.slug}/${name}`, alt: base.replace(/-/g, " ") };
  } catch (err) {
    chip.textContent = `Couldn't upload ${file.name}: ${err.message}`; chip.style.color = "var(--accent)";
    return null;
  }
}

function collect() {
  const v = (id) => document.getElementById(id).value.trim().replace(/\s*\n\s*/g, " ");
  return {
    title: v("f-title"), dek: v("f-dek"), date: v("f-date"), category: (ed.cats || []).length > 1 ? [...ed.cats] : (ed.cats || [])[0] || "",
    cover: ed.data.cover || "", coverPosition: ed.data.coverPosition || "", heroPosition: ed.data.heroPosition || "",
    heroShape: document.querySelector("[name=f-heroShape]:checked")?.value === "vertical" ? "vertical" : "", coverAlt: v("f-coverAlt"), coverCaption: v("f-coverCaption"),
    author: v("f-author"), draft: !document.getElementById("f-draft").checked, pinned: document.getElementById("f-pinned")?.checked === true,
  };
}

function compose(d, body) {
  const line = (k, val) => (val === "" || val === undefined || val === null ? "" : `${k}: ${Array.isArray(val) ? `[${val.join(", ")}]` : val}\n`);
  let fm = "";
  for (const k of KNOWN) fm += k === "draft" ? (d.draft ? "draft: true\n" : "") : k === "pinned" ? (d.pinned ? "pinned: true\n" : "") : line(k, d[k]);
  for (const [k, val] of Object.entries(ed.extras)) fm += line(k, val === true ? "true" : val);
  return `---\n${fm}---\n${body.trim()}\n`;
}

// cover position helpers. Two separate positions: coverPosition = home tiles, heroPosition = top of the article.
const POS_DEFAULT = { coverPosition: [50, 50], heroPosition: [50, 30] }; // the site's own defaults
const posOf = (key) => { const m = String(ed?.data?.[key] || "").match(/^([\d.]+)% ([\d.]+)%$/); return m ? [+m[1], +m[2]] : POS_DEFAULT[key]; };
const posCss = (key) => posOf(key).map((n) => n + "%").join(" ");
const posCtl = () => `<div class="pos-ctl" role="group" aria-label="Move the photo">
  <button type="button" class="b" data-pos="up" aria-label="Move the photo up">${icon("chevron-up")}</button><button type="button" class="b" data-pos="down" aria-label="Move the photo down">${icon("chevron-down")}</button>
  <button type="button" class="b" data-pos="left" aria-label="Move the photo left">${icon("chevron-left")}</button><button type="button" class="b" data-pos="right" aria-label="Move the photo right">${icon("chevron-right")}</button>
  <button type="button" class="b" data-pos="center">Center</button></div>`;
function drawPos() { // (re)draws the position box in the left panel and the cover thumbnail
  const box = document.getElementById("pos-box"); if (!box) return;
  box.hidden = !ed?.data?.cover;
  if (!ed?.data?.cover) return;
  const d = collect(), body = document.getElementById("body")?.value || "";
  const words = body.replace(/[#>*_`\[\]()!-]/g, " ").split(/\s+/).filter(Boolean).length;
  const label = `${d.date ? new Date(d.date + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" }) : "Date"} · ${Math.max(1, Math.round(words / 220))} min read`;
  const src = esc(imgUrl(ed.data.cover)), home = posCss("coverPosition");
  const tile = (big) => `<div class="mh-tile${big ? " big" : ""}"><div class="pos-frame" data-key="coverPosition" title="Drag to reposition"><img src="${src}" alt="" draggable="false" style="object-position:${home}"></div>
    <span class="mh-label">${esc(label)}</span><span class="mh-title">${esc(d.title || "Your headline")}</span></div>`;
  box.innerHTML = `<section class="pos-sec" data-sec="coverPosition" aria-label="Position on the home page">
      <div class="pos-sec-h"><strong>Home page</strong><span class="hint">drag a tile or use the arrows · big tile while it's the newest article · the article photo is moved in the Preview</span></div>
      <div class="mh-grid">${tile(true)}<div class="mh-col"><div class="mh-follow">FOLLOW<br>@ZAZZIMAG</div>${tile(false)}</div></div>
      ${posCtl()}</section>`;
  const t = document.getElementById("cover-pick"); if (t) t.style.backgroundPosition = home; // the thumbnail is tile-shaped
}

function preview() {
  drawPos(); // keeps the home page preview's title, date and read time in step with the form
  const pv = document.getElementById("pv"); if (!pv) return;
  const d = collect(), body = document.getElementById("body").value;
  const html = markdown(body || "*Start writing…*").replace(/src="(\/images\/articles\/[^"]+)"/g, (m, u) => `src="${imgUrl(u)}"`);
  pv.innerHTML = `<div class="article-head"><div class="crumbs label"><span>Articles</span><span>/</span><span>${esc([].concat(d.category || []).join(" · ") || "Category")}</span></div>
    <h1>${esc(d.title || "Your headline")}</h1>${d.dek ? `<p class="dek">${esc(d.dek)}</p>` : ""}
    <div class="meta label"><span>${esc(d.date)}</span>${d.author ? `<span>Written by ${esc(d.author)}</span>` : ""}</div></div>
    ${d.cover ? `<figure class="hero${d.heroShape === "vertical" ? " vertical" : ""}" data-sec="heroPosition"><div class="ph pos-frame pos-hero" data-key="heroPosition" title="Drag to reposition the article photo"><img src="${esc(imgUrl(d.cover))}" alt="" draggable="false" style="object-position:${posCss("heroPosition")}">
      <div class="pos-ui" role="group" aria-label="Article photo position"><button type="button" data-pos="up" aria-label="Move the photo up">${icon("chevron-up")}</button><button type="button" data-pos="down" aria-label="Move the photo down">${icon("chevron-down")}</button><button type="button" data-pos="left" aria-label="Move the photo left">${icon("chevron-left")}</button><button type="button" data-pos="right" aria-label="Move the photo right">${icon("chevron-right")}</button><button type="button" data-pos="center" class="txt">Center</button></div>
      <span class="pos-hint">Drag to reposition · only the article</span></div>${d.coverCaption ? `<figcaption>${esc(d.coverCaption)}</figcaption>` : ""}</figure>` : ""}
    <div class="body">${html}</div>`;
}

async function save() {
  const d = collect(), body = document.getElementById("body").value;
  if (!d.title) return status("Add a title.", "err");
  if (!ed.slug) return status("Add a web address.", "err");
  if (!ed.cats.length) return status("Choose at least one category.", "err");
  if (!d.author && !d.draft) { document.getElementById("f-author").focus(); return status("Published articles need a writer's name in “Written by”. Add it, or untick Published to save a draft.", "err"); }
  if (!d.cover && !d.draft) return status("Published articles need a cover photo. Upload one, or untick Published to save a draft.", "err");
  const used = [...ed.pending.entries()].filter(([name]) => (body + d.cover).includes(`/images/articles/${ed.slug}/${name}`)).map(([name, p]) => ({ name, sha: p.sha }));
  const btn = document.getElementById("save"); btn.disabled = true; status("Saving…");
  try {
    { const map = cropMap(); for (const k of Object.keys(map)) if (!body.includes("/" + k)) delete map[k]; setCropMap(map); } // forget crops no longer in the text
    const renameFrom = !ed.isNew && ed.origSlug && ed.origSlug !== ed.slug ? ed.origSlug : undefined;
    await api("save", { method: "POST", body: { slug: ed.slug, isNew: ed.isNew, content: compose(d, body), images: used, renameFrom } });
    for (const { name } of used) recent.set(`/images/articles/${ed.slug}/${name}`, ed.pending.get(name).preview);
    renderList(d.draft ? `Saved "${d.title}" as a draft.` : `Saved "${d.title}". It will be live on the site in about a minute.`);
  } catch (err) { if (err.message !== "auth") { status(err.message, "err"); btn.disabled = false; } }
}

// ---------- store ----------
let store = null; // { products: [], pending: Map(name -> {sha, preview}) }

async function renderStore(flash = "") {
  tab = "store";
  app.innerHTML = topBar(`<button class="b primary" type="button" data-act="add-product">${icon("plus")}<span>Add product</span></button>`) +
    `<main class="wrap c"><div class="list-head"><div><span class="label">Store</span><h1>Products</h1></div><p class="status ok" id="flash">${esc(flash)}</p></div><div id="prods" class="prods"><div class="panel empty">Loading…</div></div></main>`;
  try {
    const { products } = await api("products");
    store = { products, pending: new Map() };
    drawProducts();
  } catch (err) { if (err.message !== "auth") document.getElementById("prods").innerHTML = `<div class="panel empty status err">${esc(err.message)}</div>`; }
}

const STATUSES = [["soon", "Coming soon"], ["available", "Available"], ["soldout", "Sold out"]];
const storeImg = (u) => { const m = u && u.match(/^\/images\/store\/(.+)$/); const p = m && store?.pending.get(m[1]); return p ? p.preview : shown(u); };

function drawProducts() {
  const box = document.getElementById("prods");
  const ps = store.products;
  box.innerHTML = (ps.length ? ps.map((p, i) => `
    <div class="prod${p.hidden ? " hidden-p" : ""}" data-i="${i}">${p.slug && !p.hidden ? "" : ""}
      <button type="button" class="pthumb" data-act="p-photo" aria-label="Upload photo for ${esc(p.name || "product")}" style="${p.image ? `background-image:url('${esc(storeImg(p.image))}')` : ""}">${p.image ? "" : icon("image-plus")}</button>
      <div class="pf">
        <div class="three">

  ctx.drawImage(img, sx, sy, w, h, 0, 0, c.width, c.height);

}
// the photo as it will be posted: the original, with the logo stamped on (or not)
// With a frame (the default): the whole photo on white, never cropped. The white border is made wider
// on two sides only when needed to reach a shape Instagram accepts.
async function igRender(origSrc, withLogo, corner, logoId, framed = false) {
  let img = await loadImg(origSrc);
  const L = igq.schedule.logo, F = igq.schedule.frame;
  let c, area; // area = where the photo itself sits; the logo always goes on the photo, never on the frame
  if (framed) {
    const pad = Math.round(Math.min(img.naturalWidth, img.naturalHeight) * (F.size / 100));
    let cw = img.naturalWidth + 2 * pad, ch = img.naturalHeight + 2 * pad;
    if (cw / ch < 0.8) cw = Math.ceil(ch * 0.8);
    if (cw / ch > 1.91) ch = Math.ceil(cw / 1.91);
    const s = Math.min(1, 1440 / cw);
    c = Object.assign(document.createElement("canvas"), { width: Math.round(cw * s), height: Math.round(ch * s) });
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    const w = img.naturalWidth * s, h = img.naturalHeight * s;
    area = { x: (c.width - w) / 2, y: (c.height - h) / 2, w, h };
    ctx.drawImage(img, area.x, area.y, w, h);
  } else {
    img = await loadImg(await igFit(origSrc));
    c = Object.assign(document.createElement("canvas"), { width: img.naturalWidth, height: img.naturalHeight });
    c.getContext("2d").drawImage(img, 0, 0);
    area = { x: 0, y: 0, w: c.width, h: c.height };
  }
  const ctx = c.getContext("2d");
  if (withLogo) {
    const side = Math.min(area.w, area.h); // sized from the photo's shorter side, so wide photos don't get a huge logo
    const logo = await getLogo(logoId || L.src), w = side * (L.size / 100), h = w * (logo.naturalHeight / logo.naturalWidth), m = side * 0.035;
    const [lx, ly] = logoXY(corner || L.corner, area.w, area.h, w, h, m), x = area.x + lx, y = area.y + ly;
    ctx.globalAlpha = L.opacity / 100; ctx.drawImage(logo, x, y, w, h); ctx.globalAlpha = 1;
  }
  return c.toDataURL("image/jpeg", 0.9);
}
async function igUpload(data, name) {
  const { sha } = await api("upload", { method: "POST", body: { data } });
  igData.set(name, data); igq.files.set(name, sha);
  return name;
}
// (re)make the posted version of one photo
async function igRefresh(post, p) {
  const data = await igRender(igSrc(p.orig), p.logo, post.corner, post.logoSrc, p.frame === true);

}

// Tag people: click on the photo where the person is, type their Instagram username.
function tagPeople(src, tags) {
  tags = tags.map((t) => ({ ...t }));
  return new Promise((resolve) => {
    const dlg = document.createElement("div");
    dlg.className = "crop-modal";
    dlg.innerHTML = `<div class="crop-box tag-box" role="dialog" aria-modal="true" aria-label="Tag people">
      <div class="crop-top"><strong>Tag people</strong><span class="hint">Click on a person, then type their Instagram username. Up to 20 per photo.</span></div>
      <div class="crop-stage"><div class="tag-wrap"><img alt="" draggable="false"><div class="tag-layer"></div></div></div>
      <div class="crop-bar"><span class="hint" id="tag-count"></span><span style="flex:1"></span>
        <button type="button" class="b" data-c="cancel">Cancel</button><button type="button" class="b primary" data-c="ok">Done</button></div></div>`;
    document.body.append(dlg);
    const wrap = dlg.querySelector(".tag-wrap"), layer = dlg.querySelector(".tag-layer");
    dlg.querySelector("img").src = src;
    const done = (v) => { dlg.remove(); document.removeEventListener("keydown", onKey); resolve(v); };
    const draw = (editIndex = -1) => {
      layer.innerHTML = tags.map((t, i) => `<span class="tag-pin" style="left:${t.x * 100}%;top:${t.y * 100}%" data-i="${i}">
        ${i === editIndex ? `<input class="tag-in" value="${esc(t.u)}" placeholder="username" aria-label="Instagram username" autocomplete="off" spellcheck="false">` : `<b>@${esc(t.u)}</b><button type="button" class="tag-x" data-del="${i}" aria-label="Remove @${esc(t.u)}">×</button>`}</span>`).join("");
      dlg.querySelector("#tag-count").textContent = tags.filter((t) => t.u).length ? `${tags.filter((t) => t.u).length} tagged` : "No one tagged yet";
      const inp = layer.querySelector(".tag-in");
      if (inp) {
        inp.focus();
        let closed = false; // Enter and the blur that follows must only count once
        const commit = (keep = true) => {
          if (closed) return; closed = true;
          const v = inp.value.replace(/^@/, "").trim().toLowerCase();
          if (keep && /^[a-z0-9._]{1,30}$/.test(v)) tags[editIndex].u = v; else tags.splice(editIndex, 1);
          setTimeout(() => draw(), 0);
        };
        inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); commit(); } if (e.key === "Escape") { e.stopPropagation(); commit(false); } });
        inp.addEventListener("blur", () => commit());
      }
    };
    wrap.addEventListener("click", (e) => {
      const del = e.target.closest("[data-del]");
      if (del) { tags.splice(+del.dataset.del, 1); return draw(); }
      if (e.target.closest(".tag-pin")) return;
      if (layer.querySelector(".tag-in")) return; // this click just finishes the name being typed
      if (tags.length >= 20) return;
      const r = wrap.getBoundingClientRect();
      tags.push({ u: "", x: Math.round(((e.clientX - r.left) / r.width) * 1000) / 1000, y: Math.round(((e.clientY - r.top) / r.height) * 1000) / 1000 });
      draw(tags.length - 1);
    });
    const onKey = (e) => { if (e.key === "Escape" && !e.target.closest?.(".tag-in")) done(null); };
    document.addEventListener("keydown", onKey);
    dlg.addEventListener("click", (e) => {
      if (e.target === dlg || e.target.closest("[data-c=cancel]")) return done(null);
      if (e.target.closest("[data-c=ok]")) return done(tags.filter((t) => t.u));
    });
    draw();
  });
}

// Every change is saved automatically a moment later (photos, captions, times, settings), so nothing is lost
// if you leave the tab. Saves run one at a time; a change made during a save is saved right after it.
let qTimer = null, qSaving = false, qAgain = false;
function qDirty(msg = "") {
  igq.dirty = true; drawSchedMeta();
  status(msg ? `${msg} Saving…` : "Saving…");
  clearTimeout(qTimer); qTimer = setTimeout(qSave, 1200);
}
const qPayload = () => {
  const keep = new Set(igq.queue.flatMap((it) => it.images.flatMap((p) => [p.file, p.orig, p.first].filter(Boolean))));
  return { queue: igq.queue, schedule: igq.schedule, files: [...igq.files].filter(([f]) => keep.has(f)).map(([file, sha]) => ({ file, sha })) };
};
// leaving the page with a save still waiting: send it anyway
addEventListener("pagehide", () => { if (igq?.dirty) { clearTimeout(qTimer); navigator.sendBeacon?.("/api/admin?action=saveIgQueue", new Blob([JSON.stringify(qPayload())], { type: "application/json" })); } });

async function addLogo(file) {
  try {
    status("Adding the logo…");
    const src = URL.createObjectURL(file), img = await loadImg(src);
    const s = Math.min(1, 1200 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = Object.assign(document.createElement("canvas"), { width: Math.max(1, Math.round(img.naturalWidth * s)), height: Math.max(1, Math.round(img.naturalHeight * s)) });
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(src);
    const data = c.toDataURL("image/png");
    const base = (slugify(file.name.replace(/\.[^.]+$/, "")) || "logo").slice(0, 40), name = `${base}-${rid(5)}.png`;
    const r = await api("igLogoAdd", { method: "POST", body: { file: name, name: file.name.replace(/\.[^.]+$/, "").slice(0, 40) || "Logo", data } });
