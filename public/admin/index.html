<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Zazzi Console</title>
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/site.css?v=2">
<style>
  /* Console: two-pane editor (form left, live article preview right); list view of all articles. */
  body{background:var(--soft)}
  .c-top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .c-top .wrap{display:flex;align-items:center;gap:14px;padding-block:8px}
  .c-top .logo img{width:44px;height:44px}
  .c-title{font-style:italic;font-weight:900;font-stretch:75%;font-size:22px;text-transform:uppercase}
  .c-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .b{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);padding:8px 12px;border-radius:4px;font-size:13px;font-weight:600}
  .b:hover{border-color:var(--fg)}
  .b.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .b.dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
  .b.danger{color:var(--accent)}
  .b[disabled]{opacity:.5;cursor:default}
  .b .ic{width:16px;height:16px}
  .c-tabs{display:flex;gap:4px;margin-left:8px}
  .c-tabs button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:8px 12px;border-radius:4px;font-size:13px;font-weight:600;color:var(--muted)}
  .c-tabs button[aria-current="page"]{background:var(--soft);color:var(--fg)}
  .c-tabs .ic{width:16px;height:16px}
  @media (max-width:700px){.c-title{display:none}.c-actions .b span{display:none}}
  .texts{display:grid;gap:16px;max-width:820px}
  .texts fieldset{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:18px 20px 20px;margin:0;display:grid;gap:14px}
  .texts legend{font-style:italic;font-weight:900;font-stretch:75%;font-size:20px;text-transform:uppercase;padding:0 6px}
  .texts input,.texts textarea{width:100%}
  .texts textarea{min-height:90px}
  .texts .def{background:none;border:0;padding:0;font-size:12px;color:var(--muted);text-decoration:underline;justify-self:start}
  .texts .f{display:grid;gap:6px}
  .texts-bar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--bg);border:1px solid var(--line);border-radius:6px;max-width:820px;margin-top:16px}
  .prods{display:grid;gap:12px;max-width:900px}
  .prod{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:16px;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:6px;align-items:start}
  .prod.hidden-p{opacity:.6}
  .prod .pthumb{width:120px;aspect-ratio:4/5;border:1px dashed var(--line);border-radius:4px;background:var(--soft) center/cover;display:grid;place-items:center;color:var(--muted);padding:0}
  .prod .pthumb .ic{width:26px;height:26px}
  .prod .pf{display:grid;gap:10px;min-width:0}
  .prod .pf input:not([type=checkbox]),.prod .pf textarea,.prod .pf select{width:100%}
  .prod .switch{justify-self:start}
  .prod .pf textarea{min-height:64px}
  .prod .pctl{display:grid;gap:6px}
  .prod .pctl .b{justify-content:center;padding:7px}
  .three{display:grid;grid-template-columns:1fr 170px 170px;gap:10px;align-items:end}
  @media (max-width:760px){.prod{grid-template-columns:90px minmax(0,1fr)}.prod .pthumb{width:90px}.prod .pctl{grid-column:1/-1;display:flex}.three{grid-template-columns:1fr 1fr}}
  .ig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:1100px}
  .ig-item{position:relative;display:grid;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;cursor:pointer}
  .ig-item img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:3px;background:var(--soft);transition:filter .2s,opacity .2s}
  .ig-item .cap{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
  .ig-item .row2{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .ig-item .pill{cursor:pointer}
  .ig-item input{position:absolute;opacity:0;pointer-events:none}
  .ig-item.is-hidden img{filter:grayscale(1);opacity:.35}
  .ig-item.is-hidden{border-style:dashed}
  .ig-item:focus-within{outline:2px solid var(--accent);outline-offset:2px}
  .pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:8px}
  .page-card{display:grid;gap:6px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
  .page-card img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fbfaf7;border-radius:3px}
  .page-card .pc-top{display:flex;justify-content:space-between;align-items:center}
  .page-card .pc-ctl{display:flex;gap:4px}
  .page-card .pc-ctl .b{padding:5px}
  .page-card input{width:100%;font-size:13px;padding:8px}
  .page-card label{font-size:12px}
  .add-pages{display:grid;place-items:center;gap:6px;min-height:200px;border:1.5px dashed var(--line);border-radius:6px;background:none;color:var(--muted);font-weight:600}
  .add-pages:hover{border-color:var(--fg);color:var(--fg)}
  .add-pages .ic{width:28px;height:28px}
  .vis{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px 3px 7px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:none}
  .vis .ic{width:13px;height:13px}
  .vis.on{background:#e7f6ec;border-color:#bfe5cb;color:#1d6b36}
  .vis.off{background:#f1f1f3;border-color:#d9d9de;color:#5b5e66}
  .vis:hover:not(:disabled){border-color:currentColor}
  .photo-row.is-hidden img,.page-card.is-hidden img{opacity:.35;filter:grayscale(1)}
  .photo-row.is-hidden,.page-card.is-hidden{border-style:dashed}
  .showbox{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
  .showbox input{width:16px!important;height:16px;accent-color:var(--accent)}
  .panel{background:var(--bg);border:1px solid var(--line);border-radius:6px}
  main.c{padding-block:24px 64px}

  /* login */
  .login{max-width:380px;margin:12vh auto 0;padding:28px;display:grid;gap:14px;text-align:center}
  .login img{width:120px;height:120px;margin:0 auto}
  .login h1{margin:0;font-style:italic;font-weight:900;font-stretch:70%;font-size:34px;text-transform:uppercase}
  .login form{text-align:left}

  /* list */
  .list-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .list-head h1{margin:0;font-style:italic;font-weight:900;font-stretch:70%;font-size:40px;text-transform:uppercase;line-height:1}
  .rows{display:grid;gap:8px}
  .row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
  .row img,.row .noimg{width:64px;height:80px;object-fit:cover;background:var(--soft);border-radius:3px}
  .row h3{margin:0 0 4px;font-size:16px;font-weight:700;font-stretch:85%}
  .row .meta-l{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pill{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px;border:1px solid var(--line)}
  .pill.live{background:#e7f6ec;border-color:#bfe5cb;color:#1d6b36}
  .pill.draft{background:#fff4e0;border-color:#f3d9a6;color:#8a5a00}
  .row-actions{display:flex;gap:6px}
  @media (max-width:640px){.row{grid-template-columns:52px minmax(0,1fr)}.row img,.row .noimg{width:52px;height:66px}.row-actions{grid-column:1/-1}}

  /* editor */
  .editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  @media (max-width:980px){.editor{grid-template-columns:1fr}}
  .form{padding:20px;display:grid;gap:14px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:520px){.two{grid-template-columns:1fr}}
  .hint{font-weight:400;color:var(--muted);font-size:12px}
  .slug-row{display:flex;align-items:center;border:1px solid var(--line);border-radius:2px;overflow:hidden}
  .slug-row span{padding:11px 0 11px 12px;color:var(--muted);font-family:var(--mono);font-size:12px;white-space:nowrap}
  .slug-row input{border:0;flex:1;min-width:0;font-family:var(--mono);font-size:13px;padding-left:2px}
  .cover-box{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:start}
  .cover-box .thumb{width:110px;aspect-ratio:4/5;background:var(--soft) center/cover;border:1px dashed var(--line);border-radius:4px;display:grid;place-items:center;color:var(--muted)}
  .cover-box .thumb .ic{width:26px;height:26px}
  .tb{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border:1px solid var(--line);border-bottom:0;border-radius:2px 2px 0 0;background:var(--soft)}
  .tb button{display:grid;place-items:center;width:34px;height:32px;border:0;background:none;border-radius:3px}
  .tb button:hover{background:var(--bg)}
  .tb .ic{width:17px;height:17px}
  .tb .sep{width:1px;background:var(--line);margin:4px}
  .tb .wide{width:auto;padding:0 10px;display:inline-flex;gap:6px;font-size:12px;font-weight:600}
  #ed input:not([type=checkbox]),#ed textarea,#ed select{width:100%}
  #body{min-height:420px;font-family:var(--mono);font-size:13px;line-height:1.6;border-radius:0 0 2px 2px}
  .switch{display:flex;align-items:center;gap:10px;font-weight:600}
  .switch input{width:18px;height:18px;accent-color:var(--accent)}
  .save-bar{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--bg);border-top:1px solid var(--line);border-radius:0 0 6px 6px;margin:6px -20px -20px}
  .status{font-size:13px;color:var(--muted)}
  .status.err{color:var(--accent)}
  .status.ok{color:#1d6b36}
  .preview{padding:0 0 24px;overflow:hidden}
  .preview .pv-label{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
  .preview .article-head{padding:24px 20px 0}
  .preview .article-head h1{font-size:clamp(28px,4vw,46px)}
  .preview .hero{margin:20px 20px 0;max-width:none}
  .preview .body{margin:24px 20px 0;font-size:17px}
  .uploading{display:flex;gap:8px;flex-wrap:wrap}
  .photos{display:grid;gap:10px;margin-top:14px}
  .photos:empty{display:none}
  .photo-row{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:4px}
  .photo-row img{width:84px;height:105px;object-fit:cover;border-radius:3px;background:var(--soft)}
  .photo-row .fields{display:grid;gap:8px}
  .photo-row .num{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .confirm{display:flex;gap:6px;align-items:center;font-size:13px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
/* cover position */
.pos-box{display:grid;gap:10px;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:8px}
.pos-box[hidden]{display:none}
.pos-previews{display:grid;grid-template-columns:2fr 2.4fr 3.6fr;gap:12px;align-items:end}
.pos-previews figure{margin:0;display:grid;gap:4px}
.pos-frame{overflow:hidden;border-radius:4px;background:var(--soft);cursor:grab;touch-action:none;user-select:none}
.pos-frame.dragging{cursor:grabbing}
.pos-frame img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.pos-ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pos-ctl .b{min-width:40px;justify-content:center}
/* Video tab */
.vid-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1100px}
.vid-box{display:flex;flex-direction:column;gap:12px;padding:18px}
.vid-frame{background:#111;border-radius:8px;overflow:hidden;display:grid;place-items:center;min-height:120px}
.vid-frame video{display:block;width:100%;max-height:360px;object-fit:contain}
.vid-frame.wide video,#vid-now video{aspect-ratio:1120/472;object-fit:cover;max-height:none}
.vid-fields{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.vid-fields label{display:flex;flex-direction:column;gap:4px;font-size:13px}
.vid-fields input{width:120px}
.vid-actions{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:800px){.vid-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { markdown, frontmatter } from "./markdown.js";
import { icon } from "./icons.js";
import { SCHEMA } from "./site-schema.js";

const app = document.getElementById("app");
const esc = (s = "") => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slugify = (s) => s.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 70);
const today = () => new Date().toISOString().slice(0, 10);
const KNOWN = ["title", "dek", "date", "category", "cover", "coverPosition", "coverAlt", "coverCaption", "author", "draft"];

async function api(action, { method = "GET", body, query = "" } = {}) {
  const r = await fetch(`/api/admin?action=${action}${query}`, {
    method, credentials: "same-origin",
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await r.json(); } catch {}
  if (r.status === 401 && action !== "login") { renderLogin("Your session ended. Please log in again."); throw new Error("auth"); }
  if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
}

let tab = "articles";
function topBar(extra = "") {
  return `<header class="c-top"><div class="wrap">
    <a class="logo" href="/admin/" aria-label="Console home"><img src="/assets/logo.png" alt=""></a>
    <span class="c-title">Console</span>
    <nav class="c-tabs" aria-label="Console sections">
      <button type="button" data-act="tab-articles" ${tab === "articles" ? 'aria-current="page"' : ""}>${icon("newspaper")}<span>Articles</span></button>
      <button type="button" data-act="tab-issues" ${tab === "issues" ? 'aria-current="page"' : ""}>${icon("book-open")}<span>Issues</span></button>
      <button type="button" data-act="tab-store" ${tab === "store" ? 'aria-current="page"' : ""}>${icon("shopping-bag")}<span>Store</span></button>
      <button type="button" data-act="tab-insta" ${tab === "insta" ? 'aria-current="page"' : ""}>${icon("instagram")}<span>Instagram</span></button>
      <button type="button" data-act="tab-video" ${tab === "video" ? 'aria-current="page"' : ""}>${icon("film")}<span>Video</span></button>
      <button type="button" data-act="tab-texts" ${tab === "texts" ? 'aria-current="page"' : ""}>${icon("pencil")}<span>Site texts</span></button>
    </nav>
    <div class="c-actions">${extra}
      <a class="b" href="/preview/" target="_blank" rel="noopener">${icon("eye")}<span>View site</span></a>
      <button class="b" type="button" data-act="logout">${icon("log-out")}<span>Log out</span></button>
    </div></div></header>`;
}

// ---------- login ----------
// Pages protected by the preview password send people here with ?next=/the/page/
const nextPage = (() => { const n = new URLSearchParams(location.search).get("next") || ""; return n.startsWith("/") && !n.startsWith("//") ? n : ""; })();
function goNext() { if (!nextPage) return false; location.replace(nextPage); return true; }

function renderLogin(msg = nextPage ? "Log in to see the full site preview." : "") {
  app.innerHTML = `<main class="wrap"><div class="panel login">
    <img src="/assets/logo.png" alt="Zazzi magazine">
    <h1>Console</h1>
    <form id="login"><label for="pw">Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <button class="btn alt" type="submit" style="justify-self:stretch;justify-content:center">Log in ${icon("arrow-right")}</button>
    <p class="status ${nextPage && !arguments.length ? "" : "err"}" id="lmsg" ${msg ? "" : "hidden"}>${esc(msg)}</p></form></div></main>`;
  document.getElementById("pw").focus();
  document.getElementById("login").onsubmit = async (e) => {
    e.preventDefault();
    const m = document.getElementById("lmsg");
    m.hidden = true;
    try { await api("login", { method: "POST", body: { password: document.getElementById("pw").value } }); if (!goNext()) renderList(); }
    catch (err) { if (err.message !== "auth") { m.textContent = err.message; m.hidden = false; } }
  };
}

// ---------- show / hide switch used in the lists ----------
const visBtn = (type, slug, hidden) => `<button type="button" class="vis ${hidden ? "off" : "on"}" data-act="toggle-vis" data-type="${type}" data-slug="${esc(slug)}" data-hidden="${hidden ? 1 : 0}" aria-pressed="${!hidden}" title="${hidden ? "Hidden from the site. Click to show it" : "Shown on the site. Click to hide it"}">${icon(hidden ? "eye-off" : "eye")}<span>${hidden ? "Hidden" : "Shown"}</span></button>`;

// ---------- list ----------
let categories = [];
async function renderList(flash = "") {
  tab = "articles";
  app.innerHTML = topBar(`<button class="b primary" type="button" data-act="new">${icon("plus")}<span>New article</span></button>`) +
    `<main class="wrap c"><div class="list-head"><div><span class="label">Articles</span><h1>Your stories</h1></div><p class="status ok" id="flash">${esc(flash)}</p></div><div class="rows" id="rows"><div class="panel empty">Loading articles…</div></div></main>`;
  try {
    const { articles } = await api("list");
    categories = [...new Set(articles.map((a) => a.category).filter(Boolean))];
    const rows = document.getElementById("rows");
    if (!articles.length) { rows.innerHTML = `<div class="panel empty">No articles yet. Click <b>New article</b> to write your first one.</div>`; return; }
    rows.innerHTML = articles.map((a) => `<div class="row" data-slug="${esc(a.slug)}">
      ${a.cover ? `<img src="${esc(shown(a.cover))}" alt="" loading="lazy">` : `<div class="noimg"></div>`}
      <div><h3>${esc(a.title)}</h3><div class="meta-l">${visBtn("article", a.slug, a.draft)}<span class="label">${esc(a.category)} · ${esc(a.date)}</span></div></div>
      <div class="row-actions">
        ${a.draft ? "" : `<a class="b" href="/articles/${esc(a.slug)}/" target="_blank" rel="noopener" aria-label="View">${icon("eye")}</a>`}
        <button class="b" type="button" data-act="edit">${icon("pencil")}<span>Edit</span></button>
        <button class="b danger" type="button" data-act="ask-delete" aria-label="Delete">${icon("trash-2")}</button>
      </div></div>`).join("");
  } catch (err) {
    if (err.message !== "auth") document.getElementById("rows").innerHTML = `<div class="panel empty status err">${esc(err.message)}</div>`;
  }
}

// ---------- editor ----------
let ed = null; // { slug, isNew, data, extras, pending: Map(name -> {sha, url}) }
// Photos saved in this session keep showing from memory while the site republishes (about a minute)
const recent = new Map(); // "/images/articles/slug/name.jpg" -> data URL
const shown = (u) => recent.get(u) || u;

async function openEditor(slug) {
  if (!slug) {
    ed = { slug: "", isNew: true, data: { date: today(), author: "", draft: true }, extras: {}, body: "", pending: new Map() };
    return renderEditor();
  }
  app.innerHTML = topBar() + `<main class="wrap c"><div class="panel empty">Loading…</div></main>`;
  try {
    const { raw } = await api("article", { query: `&slug=${encodeURIComponent(slug)}` });
    const { data, body } = frontmatter(raw);
    const extras = Object.fromEntries(Object.entries(data).filter(([k]) => !KNOWN.includes(k)));
    ed = { slug, isNew: false, data, extras, body: body.replace(/^\n+/, ""), pending: new Map() };
    renderEditor();
  } catch (err) { if (err.message !== "auth") renderList(); }
}

function field(id, label, value = "", attrs = "", hint = "") {
  return `<label for="${id}">${label}${hint ? ` <span class="hint">${hint}</span>` : ""}<input id="${id}" value="${esc(value)}" ${attrs}></label>`;
}

function renderEditor() {
  const d = ed.data;
  app.innerHTML = topBar(`<button class="b" type="button" data-act="back">${icon("newspaper")}<span>All articles</span></button>`) + `
  <main class="wrap c"><div class="editor">
    <form class="panel form" id="ed" autocomplete="off">
      <span class="label">${ed.isNew ? "New article" : "Edit article"}</span>
      ${field("f-title", "Title", d.title, "required")}
      <label for="f-slug">Web address <span class="hint">${ed.isNew ? "set automatically from the title" : "can't be changed after publishing"}</span>
        <div class="slug-row"><span>zazzimag.com/articles/</span><input id="f-slug" value="${esc(ed.slug)}" ${ed.isNew ? "" : "disabled"} pattern="[a-z0-9][a-z0-9\-]*"></div></label>

          <button type="button" data-md="list" title="List">${icon("list")}</button>

        </div>
        <textarea id="body" spellcheck="true">${esc(ed.body)}</textarea>
        <input type="file" id="photo-file" accept="image/*" multiple hidden>
        <p class="hint" style="margin:6px 0 0">Leave an empty line between paragraphs. Photos added together appear side by side.</p>

        <button class="b primary" type="submit" id="save">${icon("save")}<span>Save</span></button>
        ${ed.isNew ? "" : `<a class="b" href="/articles/${esc(ed.slug)}/" target="_blank" rel="noopener">${icon("eye")}<span>Open live page</span></a>`}

    </form>
    <section class="panel preview" aria-label="Preview"><div class="pv-label label">${icon("eye")}Preview</div><div id="pv"></div></section>
  </div></main>`;

  const $ = (id) => document.getElementById(id);
  const titleEl = $("f-title"), slugEl = $("f-slug"), body = $("body");
  let slugTouched = !ed.isNew || Boolean(ed.slug);

  titleEl.oninput = () => { if (ed.isNew && !slugTouched) setSlug(slugify(titleEl.value)); preview(); };
  slugEl.oninput = () => { slugTouched = true; setSlug(slugify(slugEl.value), true); };
  app.querySelectorAll("#ed input, #ed textarea").forEach((el) => el.addEventListener("input", preview));

  function setSlug(next, keepCaret) {
    const prev = ed.slug;
    ed.slug = next;
    if (!keepCaret || slugEl.value !== next) slugEl.value = next;
    if (prev && prev !== next) { // keep photo links pointing at the right folder
      const a = `/images/articles/${prev}/`, b = `/images/articles/${next}/`;
      body.value = body.value.split(a).join(b);
      if (ed.data.cover) ed.data.cover = ed.data.cover.split(a).join(b);
    }
    preview();
  }

  // formatting toolbar
  app.querySelectorAll("[data-md]").forEach((btn) => btn.onclick = () => {
    const s = body.selectionStart, e = body.selectionEnd, sel = body.value.slice(s, e);
    const kind = btn.dataset.md;
    let text = sel, before = "", after = "";
    if (kind === "bold") { before = after = "**"; text ||= "bold text"; }
    if (kind === "italic") { before = after = "*"; text ||= "italic text"; }
    if (kind === "link") { before = "["; after = "](https://)"; text ||= "link text"; }
    if (kind === "h2") { before = "\n\n## "; after = "\n\n"; text ||= "Subheading"; }
    if (kind === "quote") { before = "\n\n> "; after = "\n\n"; text ||= "Quote"; }
    if (kind === "list") { text = (sel || "First item\nSecond item").split("\n").map((l) => `- ${l.replace(/^- /, "")}`).join("\n"); before = "\n\n"; after = "\n\n"; }
    body.setRangeText(before + text + after, s, e, "end");
    body.focus(); preview();
  });

  // photos
  $("photo-btn").onclick = () => { if (needSlug()) $("photo-file").click(); };
  $("photo-file").onchange = async (e) => {
    const files = [...e.target.files]; e.target.value = "";
    const lines = [];
    for (const f of files) { const p = await addPhoto(f); if (p) lines.push(`![${p.alt}](${p.url} "")`); }
    if (lines.length) { const at = body.selectionStart; body.setRangeText(`\n\n${lines.join("\n")}\n\n`, at, at, "end"); preview(); renderPhotos(); }
  };
  const pickCover = () => { if (needSlug()) $("cover-file").click(); };
  $("cover-btn").onclick = pickCover; $("cover-pick").onclick = pickCover;
  $("cover-file").onchange = async (e) => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    const p = await addPhoto(f, "cover");
    if (p) { ed.data.cover = p.url; ed.data.coverPosition = ""; $("cover-pick").style.backgroundImage = `url('${imgUrl(p.url)}')`; $("cover-pick").innerHTML = ""; if (!$("f-coverAlt").value) $("f-coverAlt").value = p.alt; drawPos(); preview(); }
  };

  // ---- cover position: where the photo is centred when the site crops it ----
  const posOf = () => { const m = String(ed.data.coverPosition || "").match(/^([\d.]+)% ([\d.]+)%$/); return m ? [+m[1], +m[2]] : [50, 50]; };
  const setPos = (x, y) => {
    x = Math.round(Math.min(100, Math.max(0, x))); y = Math.round(Math.min(100, Math.max(0, y)));
    ed.data.coverPosition = x === 50 && y === 50 ? "" : `${x}% ${y}%`;
    drawPos(); preview();
  };
  function drawPos() {
    const box = $("pos-box"); if (!box) return;
    box.hidden = !ed.data.cover;
    if (!ed.data.cover) return;
    const [x, y] = posOf(), src = imgUrl(ed.data.cover);
    box.querySelectorAll(".pos-frame img").forEach((im) => { if (im.getAttribute("src") !== src) im.src = src; im.style.objectPosition = `${x}% ${y}%`; });
    $("pos-val").textContent = ed.data.coverPosition ? `${x}% across, ${y}% down` : "Centred";
  }
  $("pos-box").addEventListener("click", (e) => {
    const dir = e.target.closest("[data-pos]")?.dataset.pos; if (!dir) return;
    const [x, y] = posOf(), S = 5;
    // "Move the photo up" slides the picture up in the frame, showing more of its lower part
    if (dir === "up") setPos(x, y + S); if (dir === "down") setPos(x, y - S);
    if (dir === "left") setPos(x + S, y); if (dir === "right") setPos(x - S, y);
    if (dir === "center") setPos(50, 50);
  });
  $("pos-box").querySelectorAll(".pos-frame").forEach((fr) => {
    let drag = null;
    fr.addEventListener("pointerdown", (e) => {
      const im = fr.querySelector("img"); if (!im.naturalWidth) return;
      const fw = fr.clientWidth, fh = fr.clientHeight, s = Math.max(fw / im.naturalWidth, fh / im.naturalHeight);
      drag = { x0: e.clientX, y0: e.clientY, p: posOf(), ox: im.naturalWidth * s - fw, oy: im.naturalHeight * s - fh };
      fr.setPointerCapture(e.pointerId); fr.classList.add("dragging");
    });
    fr.addEventListener("pointermove", (e) => {
      if (!drag) return;
      // dragging the photo right shows more of its left side (a lower % across)
      const nx = drag.ox > 0 ? drag.p[0] - ((e.clientX - drag.x0) / drag.ox) * 100 : drag.p[0];
      const ny = drag.oy > 0 ? drag.p[1] - ((e.clientY - drag.y0) / drag.oy) * 100 : drag.p[1];
      setPos(nx, ny);
    });
    const end = () => { drag = null; fr.classList.remove("dragging"); };
    fr.addEventListener("pointerup", end); fr.addEventListener("pointercancel", end);
  });
  drawPos();

  function needSlug() {
    if (ed.slug) return true;
    status("Add a title first, so the photos have a folder.", "err"); titleEl.focus(); return false;
  }

  $("ed").onsubmit = (e) => { e.preventDefault(); save(); };

  // "Photos in this article": caption/credit and description for every photo in the text
  const box = $("photos");
  let t;
  body.addEventListener("input", () => { clearTimeout(t); t = setTimeout(renderPhotos, 400); });
  box.addEventListener("change", (e) => {
    if (e.target.dataset.show === undefined) return;
    const i = +e.target.dataset.show, show = e.target.checked;
    const m = [...body.value.matchAll(IMG_RE)][i]; if (!m) return;
    const v = body.value, at = m.index;
    body.value = show ? (v[at - 1] === "~" ? v.slice(0, at - 1) + v.slice(at) : v) : (v[at - 1] === "~" ? v : v.slice(0, at) + "~" + v.slice(at));
    renderPhotos(); preview();
  });
  box.addEventListener("input", (e) => {
    if (e.target.dataset.show !== undefined) return;
    const row = e.target.closest(".photo-row"); if (!row) return;
    const i = +row.dataset.i, k = e.target.dataset.k;
    const clean = (v) => v.replace(/\s*\n\s*/g, " ").replace(/"([^"]*)"/g, "\u201c$1\u201d").replace(/"/g, "\u201d");
    let n = 0;
    body.value = body.value.replace(IMG_RE, (full, alt, src, cap = "") => {
      if (n++ !== i) return full;
      const a = k === "alt" ? clean(e.target.value).replace(/[\[\]]/g, "") : alt;
      const c = k === "cap" ? clean(e.target.value) : cap;
      return `![${a}](${src} "${c}")`;
    });
    preview();
  });
  renderPhotos();
  preview();
}

const IMG_RE = /!\[([^\]]*)\]\((\S+?)(?:\s+"([^"]*)")?\)/g;
function renderPhotos() {
  const box = document.getElementById("photos"), body = document.getElementById("body");
  if (!box || !body) return;
  const list = [...body.value.matchAll(IMG_RE)];
  const isHidden = (m) => body.value[m.index - 1] === "~";
  box.innerHTML = list.length ? `<span class="label">Photos in this article</span>` + list.map((m, i) => `
    <div class="photo-row${isHidden(m) ? " is-hidden" : ""}" data-i="${i}">
      <img src="${esc(imgUrl(m[2]))}" alt="">
      <div class="fields"><span class="num">Photo ${i + 1}</span>
        <label class="showbox"><input type="checkbox" data-show="${i}" ${isHidden(m) ? "" : "checked"}> Shown on the site</label>
        <label for="pc-${i}">Caption / photo credit<input id="pc-${i}" data-k="cap" value="${esc(m[3] || "")}" placeholder="e.g. Shibuya, October 2026. Photo: Your Name"></label>
        <label for="pa-${i}">Describe the photo <span class="hint">for screen readers</span><input id="pa-${i}" data-k="alt" value="${esc(m[1] || "")}"></label>
      </div>
    </div>`).join("") : "";
}

function imgUrl(u) { // pending uploads show from memory until they're published
  const m = u && u.match(/^\/images\/articles\/[^/]+\/(.+)$/);
  const p = m && ed?.pending.get(m[1]);
  return p ? p.preview : shown(u);
}

function status(text, kind = "") { const s = document.getElementById("st"); if (s) { s.textContent = text; s.className = `status ${kind}`; } }

async function resize(file, max = 2000) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
  const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg", 0.85);
}

async function addPhoto(file, prefix = "") {
  const box = document.getElementById("uploading");
  const chip = document.createElement("span"); chip.className = "pill"; chip.textContent = `Uploading ${file.name}…`; box.append(chip);
  try {
    const data = await resize(file);
    const { sha } = await api("upload", { method: "POST", body: { data } });
    const base = slugify(file.name.replace(/\.[^.]+$/, "")) || "photo";
    let name = `${prefix ? prefix + "-" : ""}${base}.jpg`, n = 2;
    while (ed.pending.has(name)) name = `${prefix ? prefix + "-" : ""}${base}-${n++}.jpg`;
    ed.pending.set(name, { sha, preview: data });
    chip.remove();
    return { url: `/images/articles/${ed.slug}/${name}`, alt: base.replace(/-/g, " ") };
  } catch (err) {
    chip.textContent = `Couldn't upload ${file.name}: ${err.message}`; chip.style.color = "var(--accent)";
    return null;
  }
}

function collect() {
  const v = (id) => document.getElementById(id).value.trim().replace(/\s*\n\s*/g, " ");
  return {
    title: v("f-title"), dek: v("f-dek"), date: v("f-date"), category: v("f-cat"),
    cover: ed.data.cover || "", coverPosition: ed.data.coverPosition || "", coverAlt: v("f-coverAlt"), coverCaption: v("f-coverCaption"),
    author: v("f-author"), draft: !document.getElementById("f-draft").checked,
  };
}

function compose(d, body) {
  const line = (k, val) => (val === "" || val === undefined || val === null ? "" : `${k}: ${Array.isArray(val) ? `[${val.join(", ")}]` : val}\n`);
  let fm = "";
  for (const k of KNOWN) fm += k === "draft" ? (d.draft ? "draft: true\n" : "") : line(k, d[k]);
  for (const [k, val] of Object.entries(ed.extras)) fm += line(k, val === true ? "true" : val);
  return `---\n${fm}---\n${body.trim()}\n`;
}

function preview() {
  const pv = document.getElementById("pv"); if (!pv) return;
  const d = collect(), body = document.getElementById("body").value;
  const html = markdown(body || "*Start writing…*").replace(/src="(\/images\/articles\/[^"]+)"/g, (m, u) => `src="${imgUrl(u)}"`);
  pv.innerHTML = `<div class="article-head"><div class="crumbs label"><span>Articles</span><span>/</span><span>${esc(d.category || "Category")}</span></div>
    <h1>${esc(d.title || "Your headline")}</h1>${d.dek ? `<p class="dek">${esc(d.dek)}</p>` : ""}
    <div class="meta label"><span>${esc(d.date)}</span>${d.author ? `<span>Written by ${esc(d.author)}</span>` : ""}</div></div>
    ${d.cover ? `<figure class="hero"><div class="ph"><img src="${esc(imgUrl(d.cover))}" alt=""${d.coverPosition ? ` style="object-position:${esc(d.coverPosition)}"` : ""}></div>${d.coverCaption ? `<figcaption>${esc(d.coverCaption)}</figcaption>` : ""}</figure>` : ""}
    <div class="body">${html}</div>`;
}

async function save() {
  const d = collect(), body = document.getElementById("body").value;
  if (!d.title) return status("Add a title.", "err");
  if (!ed.slug) return status("Add a web address.", "err");
  if (!d.category) return status("Choose a category.", "err");
  if (!d.author && !d.draft) { document.getElementById("f-author").focus(); return status("Published articles need a writer's name in “Written by”. Add it, or untick Published to save a draft.", "err"); }
  if (!d.cover && !d.draft) return status("Published articles need a cover photo. Upload one, or untick Published to save a draft.", "err");
  const used = [...ed.pending.entries()].filter(([name]) => (body + d.cover).includes(`/images/articles/${ed.slug}/${name}`)).map(([name, p]) => ({ name, sha: p.sha }));
  const btn = document.getElementById("save"); btn.disabled = true; status("Saving…");
  try {
    await api("save", { method: "POST", body: { slug: ed.slug, isNew: ed.isNew, content: compose(d, body), images: used } });
    for (const { name } of used) recent.set(`/images/articles/${ed.slug}/${name}`, ed.pending.get(name).preview);
    renderList(d.draft ? `Saved "${d.title}" as a draft.` : `Saved "${d.title}". It will be live on the site in about a minute.`);
  } catch (err) { if (err.message !== "auth") { status(err.message, "err"); btn.disabled = false; } }
}

// ---------- store ----------
let store = null; // { products: [], pending: Map(name -> {sha, preview}) }

async function renderStore(flash = "") {
  tab = "store";
  app.innerHTML = topBar(`<button class="b primary" type="button" data-act="add-product">${icon("plus")}<span>Add product</span></button>`) +
    `<main class="wrap c"><div class="list-head"><div><span class="label">Store</span><h1>Products</h1></div><p class="status ok" id="flash">${esc(flash)}</p></div><div id="prods" class="prods"><div class="panel empty">Loading…</div></div></main>`;
  try {
    const { products } = await api("products");
    store = { products, pending: new Map() };
    drawProducts();
  } catch (err) { if (err.message !== "auth") document.getElementById("prods").innerHTML = `<div class="panel empty status err">${esc(err.message)}</div>`; }
}

const STATUSES = [["soon", "Coming soon"], ["available", "Available"], ["soldout", "Sold out"]];
const storeImg = (u) => { const m = u && u.match(/^\/images\/store\/(.+)$/); const p = m && store?.pending.get(m[1]); return p ? p.preview : shown(u); };

function drawProducts() {
  const box = document.getElementById("prods");
  const ps = store.products;
  box.innerHTML = (ps.length ? ps.map((p, i) => `
    <div class="prod${p.hidden ? " hidden-p" : ""}" data-i="${i}">${p.slug && !p.hidden ? "" : ""}
      <button type="button" class="pthumb" data-act="p-photo" aria-label="Upload photo for ${esc(p.name || "product")}" style="${p.image ? `background-image:url('${esc(storeImg(p.image))}')` : ""}">${p.image ? "" : icon("image-plus")}</button>
      <div class="pf">

          <label>Status<select data-f="status">${STATUSES.map(([v, l]) => `<option value="${v}" ${(p.status || "soon") === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        </div>
        <label>Description <span class="hint">shown on the product page. Supports **bold**, *italic*, [links](https://…) and empty lines between paragraphs</span><textarea data-f="description" rows="5">${esc(p.description || "")}</textarea></label>

        <label>Describe the photo <span class="hint">for screen readers and Google</span><input data-f="imageAlt" value="${esc(p.imageAlt || "")}"></label>
        <label class="switch"><input type="checkbox" data-f="hidden" ${p.hidden ? "checked" : ""}> Hide from the site</label>
      </div>
      <div class="pctl">
        <button type="button" class="b" data-act="p-up" aria-label="Move up" ${i === 0 ? "disabled" : ""}>${icon("chevron-up")}</button>
        <button type="button" class="b" data-act="p-down" aria-label="Move down" ${i === ps.length - 1 ? "disabled" : ""}>${icon("chevron-down")}</button>
        <button type="button" class="b danger" data-act="p-del" aria-label="Remove product">${icon("trash-2")}</button>
      </div>
    </div>`).join("") : `<div class="panel empty">No products yet. Click <b>Add product</b>. Until you add some, the Store page shows the placeholder items from Site texts.</div>`) +
    `<div class="texts-bar" style="max-width:900px"><button class="b primary" type="button" data-act="p-save">${icon("save")}<span>Save store</span></button><span class="status" id="st"></span></div>
    <input type="file" id="p-file" accept="image/*" hidden>`;
}

function syncProducts() {
  document.querySelectorAll(".prod").forEach((row) => {
    const p = store.products[+row.dataset.i];
    row.querySelectorAll("[data-f]").forEach((el) => { p[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value; });
  });
}

let photoFor = -1;
document.addEventListener("change", async (e) => {
  if (e.target.id !== "p-file" || photoFor < 0) return;
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  syncProducts();
  const p = store.products[photoFor];
  status("Uploading photo…");
  try {
    const data = await resize(file, 1600);
    const { sha } = await api("upload", { method: "POST", body: { data } });
    const name = `${slugify(p.name || "product") || "product"}-${Date.now().toString(36)}.jpg`;
    store.pending.set(name, { sha, preview: data });

const recMime = () => typeof MediaRecorder !== "undefined" && ["video/mp4;codecs=avc1.4d002a", "video/mp4;codecs=avc1", "video/mp4"].find((m) => MediaRecorder.isTypeSupported(m));
async function shrinkVideo(file, start, len, onProgress) {
  const mime = recMime();
  if (!mime) throw new Error("This browser can't prepare videos. Please use Chrome, Edge or Safari on a computer.");
  const v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = URL.createObjectURL(file);
  await new Promise((ok, no) => { v.onloadedmetadata = ok; v.onerror = () => no(new Error("This video can't be read.")); });
  start = Math.max(0, Math.min(start, v.duration - 1));
  len = Math.max(1, Math.min(len, VID_MAX, v.duration - start));
  const canvas = (w, h) => Object.assign(document.createElement("canvas"), { width: w, height: h });
  const outs = [{ c: canvas(1120, 472), bps: 1_200_000 }, { c: canvas(576, 324), bps: 450_000 }];
  const draw = () => outs.forEach(({ c }) => { // fill the frame, cropping the edges (like the site does)
    const s = Math.max(c.width / v.videoWidth, c.height / v.videoHeight), w = v.videoWidth * s, h = v.videoHeight * s;
    c.getContext("2d").drawImage(v, (c.width - w) / 2, (c.height - h) / 2, w, h);
  });
  v.currentTime = start;
  await new Promise((ok) => (v.onseeked = ok));
  draw();
  const recs = outs.map(({ c, bps }) => {
    const r = new MediaRecorder(c.captureStream(30), { mimeType: mime, videoBitsPerSecond: bps });
    const parts = [];
    r.ondataavailable = (e) => e.data.size && parts.push(e.data);
    const done = new Promise((ok) => (r.onstop = () => ok(new Blob(parts, { type: "video/mp4" }))));
    return { r, done };

  recs.forEach(({ r }) => r.start(1000));
  await v.play();
  await new Promise((ok) => {
    const tick = () => {
      draw();
      const t = v.currentTime - start;
      onProgress(Math.min(t, len), len);
      if (!poster && v.currentTime >= posterAt) { poster = "pending"; outs[0].c.toBlob((b) => (poster = b), "image/jpeg", 0.78); }
      if (t >= len || v.ended) return ok();
      v.requestVideoFrameCallback ? v.requestVideoFrameCallback(tick) : requestAnimationFrame(tick);
    };
    tick();
  });

  recs.forEach(({ r }) => r.stop());

  if (!poster || poster === "pending") poster = await new Promise((ok) => outs[0].c.toBlob(ok, "image/jpeg", 0.78));
  URL.revokeObjectURL(v.src);

}
async function prepareVideo() {
  const start = Number(document.getElementById("vid-start").value) || 0;
  const len = Number(document.getElementById("vid-len").value) || 24;
  const btns = document.querySelectorAll("#vid-new button"); btns.forEach((b) => (b.disabled = true));
  status("Preparing… keep this tab open (it plays the clip once).");
  try {
    vid.result = await shrinkVideo(vid.file, start, len, (t, l) => status(`Preparing… ${Math.floor(t)} / ${Math.round(l)} seconds. Keep this tab open.`));
    const r = vid.result, mb = (b) => (b.size / 1048576).toFixed(1);
    if (vid.previewUrl) URL.revokeObjectURL(vid.previewUrl);
    vid.previewUrl = URL.createObjectURL(r.wide);
    document.getElementById("vid-new").innerHTML = `<div class="vid-frame wide"><video src="${vid.previewUrl}" muted loop autoplay playsinline></video></div>
      <p class="hint">Ready: ${mb(r.wide)} MB on computers, ${mb(r.small)} MB on phones (was ${mb(vid.file)} MB). This is how it will look.</p>
      <div class="vid-actions"><button class="b primary" type="button" data-act="vid-save">${icon("save")}<span>Save to the site</span></button><button class="b" type="button" data-act="vid-again">Change the clip</button></div>`;
    status("Check the preview, then save.", "ok");

}
const toB64 = (blob) => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = () => no(new Error("Could not read the video.")); r.readAsDataURL(blob); });
async function saveVideo() {
  const r = vid?.result; if (!r) return;
  const btns = document.querySelectorAll("#vid-new button"); btns.forEach((b) => (b.disabled = true));
  const CHUNK = 2_500_000;
  const jobs = [["wide", r.wide], ["small", r.small], ["poster", r.poster]];
  const total = jobs.reduce((n, [, b]) => n + Math.ceil(b.size / CHUNK), 0);
  let sent = 0;
  try {
    const shas = {};
    for (const [kind, blob] of jobs) {
      shas[kind] = [];
      for (let i = 0; i < blob.size; i += CHUNK) {
        status(`Uploading… ${Math.round((sent / total) * 100)}%`);
        const { sha } = await api("videoPart", { method: "POST", body: { data: await toB64(blob.slice(i, i + CHUNK)) } });
        shas[kind].push(sha); sent++;
      }
    }
    status("Saving…");
    await api("saveVideo", { method: "POST", body: { ...shas, start: r.start, length: r.len } });
    renderVideo("Saved. The new video shows on the site in about a minute.");
  } catch (err) { if (err.message !== "auth") { status(err.message, "err"); btns.forEach((b) => (b.disabled = false)); } }
}

  try {
    await api("saveIssue", { method: "POST", body: { slug: iss.slug, isNew: iss.isNew, issue: d, images: used } });
    for (const { name } of used) recent.set(`/images/issues/${iss.slug}/${name}`, iss.pending.get(name).preview);
    renderIssues(d.draft ? `Saved "${d.title}" as a draft.` : `Saved "${d.title}". It will be live on the site in about a minute.`);
  } catch (err) { if (err.message !== "auth") { status(err.message, "err"); btn.disabled = false; } }
}

// ---------- site texts ----------
async function renderTexts() {
  tab = "texts";
  app.innerHTML = topBar() + `<main class="wrap c"><div class="list-head"><div><span class="label">Site texts</span><h1>Wording</h1></div></div><div class="panel empty">Loading…</div></main>`;
  let saved = {};
  try { ({ saved } = await api("settings")); } catch (err) { if (err.message === "auth") return; }
  const get = (k) => k.split(".").reduce((o, x) => (o && typeof o === "object" ? o[x] : undefined), saved);
  const fieldHtml = (f) => {
    const v = get(f.key) ?? f.default, id = "t-" + f.key.replace(".", "-");
    if (f.type === "toggle") return `<div class="f"><label class="showbox" for="${id}"><input type="checkbox" id="${id}" data-key="${f.key}" ${v === "off" ? "" : "checked"}> ${esc(f.label)}</label></div>`;
    const control = f.type === "text"
      ? `<input id="${id}" data-key="${f.key}" value="${esc(v)}">`
      : `<textarea id="${id}" data-key="${f.key}" rows="${f.type === "list" ? 4 : 3}">${esc(v)}</textarea>`;
    return `<div class="f"><label for="${id}">${esc(f.label)}${f.hint ? ` <span class="hint">${esc(f.hint)}</span>` : ""}</label>${control}
      <button type="button" class="def" data-def="${f.key}">Use original text</button></div>`;
  };
  app.querySelector("main").innerHTML = `<div class="list-head"><div><span class="label">Site texts</span><h1>Wording</h1></div>
      <p class="hint" style="max-width:46ch;margin:0">Change any text on the site. In longer texts you can use **bold**, *italic* and [links](https://…). Changes go live about a minute after saving.</p></div>
    <form id="texts" class="texts" autocomplete="off">${SCHEMA.map((g) => `<fieldset><legend>${esc(g.group)}</legend>${g.fields.map(fieldHtml).join("")}</fieldset>`).join("")}</form>
    <div class="texts-bar"><button class="b primary" type="submit" form="texts" id="tsave">${icon("save")}<span>Save texts</span></button><span class="status" id="st"></span></div>`;
  const form = document.getElementById("texts");
  form.addEventListener("click", (e) => {
    const key = e.target.closest("[data-def]")?.dataset.def; if (!key) return;
    const f = SCHEMA.flatMap((g) => g.fields).find((x) => x.key === key);
    form.querySelector(`[data-key="${key}"]`).value = f.default;
    status("Original text restored. Save to apply.");
  });
  form.onsubmit = async (e) => {
    e.preventDefault();
    const values = Object.fromEntries([...form.querySelectorAll("[data-key]")].map((el) => [el.dataset.key, el.type === "checkbox" ? (el.checked ? "on" : "off") : el.value]));
    const btn = document.getElementById("tsave"); btn.disabled = true; status("Saving…");
    try { await api("saveSettings", { method: "POST", body: { values } }); status("Saved. The site will update in about a minute.", "ok"); }
    catch (err) { if (err.message !== "auth") status(err.message, "err"); }
    btn.disabled = false;
  };
}

// ---------- global clicks ----------
app.addEventListener("click", async (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (!act) return;
  const row = e.target.closest(".row"), slug = row?.dataset.slug;
  if (act === "logout") { await api("logout", { method: "POST" }).catch(() => {}); renderLogin(); }
  if (act === "new") openEditor();
  if (act === "tab-articles") renderList();
  if (act === "tab-texts") renderTexts();
  if (act === "tab-video") renderVideo();
  if (act === "vid-choose") document.getElementById("vid-file").click();
  if (act === "vid-here") { const v = document.getElementById("vid-src"); document.getElementById("vid-start").value = Math.floor(v.currentTime * 2) / 2; status(`Starts at ${Math.floor(v.currentTime * 2) / 2} seconds.`); }
  if (act === "vid-prepare") prepareVideo();
  if (act === "vid-again") pickVideo(vid.file);
  if (act === "vid-save") saveVideo();
  if (act === "vid-reset") {
    e.target.closest("[data-act]").disabled = true; status("Saving…");
    try { await api("resetVideo", { method: "POST" }); renderVideo("Back to the original video. The site updates in about a minute."); }
    catch (err) { if (err.message !== "auth") status(err.message, "err"); }
  }
  if (act === "tab-store") renderStore();
  if (act === "tab-insta") renderInsta();
  if (act === "tab-issues") renderIssues();
  if (act === "toggle-vis") {
    const b = e.target.closest("[data-act=toggle-vis]"), hide = b.dataset.hidden !== "1";
    b.disabled = true; b.querySelector("span").textContent = "Saving…";
    try {
      await api("setVisibility", { method: "POST", body: { type: b.dataset.type, slug: b.dataset.slug, hidden: hide } });
      b.outerHTML = visBtn(b.dataset.type, b.dataset.slug, hide);
      const f = document.getElementById("flash"); if (f) { f.className = "status ok"; f.textContent = `${hide ? "Hidden" : "Shown"}. The site updates in about a minute.`; }
    } catch (err) { if (err.message !== "auth") { b.disabled = false; b.querySelector("span").textContent = "Try again"; const f = document.getElementById("flash"); if (f) { f.className = "status err"; f.textContent = err.message; } } }
  }
  if (act === "new-issue") openIssue();
  if (act === "edit-issue") openIssue(e.target.closest("[data-islug]").dataset.islug);
  if (act === "ask-del-issue") e.target.closest(".row-actions").innerHTML = `<span class="confirm">Delete this issue and its pages? <button class="b danger" type="button" data-act="del-issue">${icon("trash-2")}Delete</button><button class="b" type="button" data-act="tab-issues">Cancel</button></span>`;
  if (act === "del-issue") {
    const row = e.target.closest("[data-islug]"); row.querySelector(".row-actions").innerHTML = `<span class="status">Deleting…</span>`;
    try { await api("deleteIssue", { method: "POST", body: { slug: row.dataset.islug } }); renderIssues("Deleted. The site updates in about a minute."); }
    catch (err) { if (err.message !== "auth") row.querySelector(".row-actions").innerHTML = `<span class="status err">${esc(err.message)}</span>`; }
  }
  const pg = e.target.closest(".page-card"), pgi = pg ? +pg.dataset.i : -1;
  if (act === "pg-left" || act === "pg-right") { syncIssue(); const j = act === "pg-left" ? pgi - 1 : pgi + 1; [iss.data.pages[pgi], iss.data.pages[j]] = [iss.data.pages[j], iss.data.pages[pgi]]; drawPages(); }
  if (act === "pg-del") { syncIssue(); iss.data.pages.splice(pgi, 1); drawPages(); status("Page removed. Save to apply."); }
  if (act === "ig-save") saveInsta();
  if (act === "add-product") { syncProducts(); store.products.push({ name: "", price: "", status: "soon", description: "", link: "", image: "", imageAlt: "", hidden: false }); drawProducts(); [...document.querySelectorAll(".prod [data-f=name]")].pop()?.focus(); }
  const prow = e.target.closest(".prod"), pi = prow ? +prow.dataset.i : -1;
  if (act === "p-photo") { photoFor = pi; document.getElementById("p-file").click(); }
  if (act === "p-up" || act === "p-down") { syncProducts(); const j = act === "p-up" ? pi - 1 : pi + 1; [store.products[pi], store.products[j]] = [store.products[j], store.products[pi]]; drawProducts(); }
  if (act === "p-del") { syncProducts(); store.products.splice(pi, 1); drawProducts(); status("Product removed. Save the store to apply."); }
  if (act === "p-save") saveStore();
  if (act === "back") renderList();
  if (act === "edit") openEditor(slug);
  if (act === "ask-delete") {
    row.querySelector(".row-actions").innerHTML = `<span class="confirm">Delete this article and its photos? <button class="b danger" type="button" data-act="delete">${icon("trash-2")}Delete</button><button class="b" type="button" data-act="cancel">Cancel</button></span>`;
  }
  if (act === "cancel") renderList();
  if (act === "delete") {
    row.querySelector(".row-actions").innerHTML = `<span class="status">Deleting…</span>`;
    try { await api("delete", { method: "POST", body: { slug } }); renderList("Deleted. The site updates in about a minute."); }
    catch (err) { if (err.message !== "auth") row.querySelector(".row-actions").innerHTML = `<span class="status err">${esc(err.message)}</span>`; }
  }
});

// ---------- start ----------
api("me").then((m) => (m.loggedIn ? (goNext() || renderList()) : renderLogin())).catch(() => renderLogin());
</script>
</body>
</html>
