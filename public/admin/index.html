  box.onchange = async (e) => {
    const card = e.target.closest(".q-post"); if (!card) return;
    const it = igq.queue[+card.dataset.i], k = e.target.dataset.q;
    if (k === "custom") { it.custom = e.target.checked; if (it.custom && !it.at) it.at = card.querySelector("[data-q=at]").value; qDirty(); drawPosts(); drawSchedMeta(); }
    if (k === "at") drawPosts();
    if (k === "frame") {
      const ph = it.images[+e.target.closest(".q-ph").dataset.k]; ph.frame = e.target.checked;
      status("Updating the photo…");
      try { await igRefresh(it, ph); qDirty(); drawPosts(); } catch (err) { if (err.message !== "auth") status(err.message, "err"); }
      return;
    }
    if (k === "corner" || k === "logo" || k === "logoSrc") {
      if (k === "corner") it.corner = e.target.value;
      if (k === "logoSrc") it.logoSrc = e.target.value;
      if (k === "logo") it.images[+e.target.closest(".q-ph").dataset.k].logo = e.target.checked;
      status("Updating the photo…");
      try { for (const ph of (k === "logo" ? [it.images[+e.target.closest(".q-ph").dataset.k]] : it.images)) await igRefresh(it, ph); qDirty(); drawPosts(); }
      catch (err) { if (err.message !== "auth") status(err.message, "err"); }
    }
  };
}

function drawHistory() {
  const el = document.getElementById("q-hist"); if (!el) return;
  el.innerHTML = igq.history.length ? `<span class="label">Posted</span>` + igq.history.slice(0, 20).map((h) => `<div class="q-h-row"><span class="label">${esc(new Date(h.postedAt).toLocaleString("en-GB", { timeZone: "Asia/Jerusalem", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))}</span>
    <span class="q-h-cap">${esc((h.caption || "").split("\n")[0] || "(no caption)")}</span>${h.permalink ? `<a class="b sm" href="${esc(h.permalink)}" target="_blank" rel="noopener">${icon("instagram")}<span>View</span></a>` : ""}</div>`).join("") : "";
}

let qMode = "single";
async function qAdd(files) {
  if (qMode === "carousel" && (files.length < 2 || files.length > 10)) return status("A carousel needs 2 to 10 photos. Choose them together.", "err");
  const up = document.getElementById("q-up"), L = igq.schedule.logo;
  const posts = qMode === "carousel" ? [files] : files.map((f) => [f]);
  let n = 0;
  try {
    for (const group of posts) {
      const post = { id: rid(12), images: [], caption: "", custom: false, at: "", corner: "", status: "queued", created: new Date().toISOString() };
      for (const f of group) {
        up.textContent = `Preparing photo ${++n} of ${files.length}…`;
        const fitted = await resize(f, 2000); // the whole photo, just made smaller
        const orig = await igUpload(fitted, `${post.id}-${rid(6)}-o.jpg`);
        const ph = { orig, file: "", logo: L.on, frame: igq.schedule.frame.on };
        await igRefresh(post, ph);
        post.images.push(ph);
      }
      igq.queue.push(post); drawPosts(); qDirty(); // each post is kept as soon as its photos are ready
    }
    up.textContent = "";
    status(`${posts.length} post${posts.length === 1 ? "" : "s"} added. Saving…`);
    drawPosts(); drawLogoPreview();
  } catch (err) { up.textContent = ""; if (err.message !== "auth") status(err.message, "err"); }
}

async function qSave() {
  clearTimeout(qTimer);
  if (qSaving) { qAgain = true; return; }
  qSaving = true; igq.dirty = false;
  const body = qPayload();
  try {
    const r = await api("saveIgQueue", { method: "POST", body });
    for (const f of body.files) igq.files.delete(f.file); // those are on the site now
    if (r.logos) igq.logos = r.logos;
    if (!igq.dirty) status(r.photosAdded ? "All changes saved. New photos reach the site in about a minute, then they can be posted." : "All changes saved.", "ok");
  } catch (err) { igq.dirty = true; if (err.message !== "auth") status(`Couldn't save: ${err.message}`, "err"); }
  qSaving = false;
  if (qAgain || igq.dirty) { qAgain = false; if (igq.dirty) qTimer = setTimeout(qSave, 800); }
}

async function qClick(act, e) {
  const card = e.target.closest(".q-post"), i = card ? +card.dataset.i : -1, it = igq?.queue[i];
  const k = e.target.closest(".q-ph") ? +e.target.closest(".q-ph").dataset.k : -1;
  if (act === "q-add-single" || act === "q-add-carousel") { qMode = act === "q-add-carousel" ? "carousel" : "single"; document.getElementById("q-file").click(); }
  if (act === "q-up" || act === "q-down") { const j = act === "q-up" ? i - 1 : i + 1; [igq.queue[i], igq.queue[j]] = [igq.queue[j], igq.queue[i]]; qDirty(); drawPosts(); }
  if (act === "q-left" || act === "q-right") { const j = act === "q-left" ? k - 1 : k + 1; [it.images[k], it.images[j]] = [it.images[j], it.images[k]]; qDirty(); drawPosts(); }
  if (act === "q-del-photo") { it.images.splice(k, 1); qDirty(); drawPosts(); }
  if (act === "q-del") { igq.queue.splice(i, 1); qDirty("Post removed."); drawPosts(); drawLogoPreview(); }
  if (act === "q-retry") { it.status = "queued"; it.error = ""; qDirty("It will be tried again."); drawPosts(); }
  if (act === "q-tag") {
    const ph = it.images[k], tags = await tagPeople(igSrc(ph.file), ph.tags || []);
    if (tags) { ph.tags = tags; qDirty(tags.length ? `${tags.length} ${tags.length === 1 ? "person" : "people"} tagged.` : "Tags removed."); drawPosts(); }
  }
  if (act === "q-crop") {
    const ph = it.images[k];
    const data = await cropPhoto(igSrc(ph.orig), null, { shapes: IG_SHAPES, title: "Crop for Instagram", onData: async (d) => d });
    if (!data) return;
    status("Updating the photo…");
    try { if (!ph.first) ph.first = ph.orig; ph.orig = await igUpload(data, `${it.id}-${rid(6)}-o.jpg`); await igRefresh(it, ph); qDirty(); drawPosts(); drawLogoPreview(); }
    catch (err) { if (err.message !== "auth") status(err.message, "err"); }
  }
  if (act === "q-uncrop") { // back to the photo as it was added, before any crop
    const ph = it.images[k]; if (!ph.first) return;
    status("Updating the photo…");
    try { ph.orig = ph.first; delete ph.first; await igRefresh(it, ph); qDirty("Back to the original photo."); drawPosts(); drawLogoPreview(); }
    catch (err) { if (err.message !== "auth") status(err.message, "err"); }
  }
  if (act === "q-logo-add") document.getElementById("q-logo-file").click();
  if (act === "q-logo-pick") { igq.schedule.logo.src = e.target.closest("[data-logo]").dataset.logo; drawGallery(); drawLogoPreview(); drawPosts(); qDirty("Logo chosen for new photos. To change photos already in the queue, press “Apply to all photos in the queue”."); }
  if (act === "q-logo-del") {
    const id = e.target.closest("[data-logo]").dataset.logo, name = logoName(id);
    const slot = e.target.closest(".q-gal-i");
    if (!slot.classList.contains("confirm-del")) { // ask once: click × again to remove
      slot.classList.add("confirm-del"); status(`Click × again to remove “${name}” from the gallery.`);
      setTimeout(() => slot.classList.remove("confirm-del"), 4000); return;
    }
    try { igq.logos = (await api("igLogoRemove", { method: "POST", body: { file: id } })).logos; }
    catch (err) { if (err.message !== "auth") status(err.message, "err"); return; }
    if (igq.schedule.logo.src === id) igq.schedule.logo.src = "default";
    igq.queue.forEach((p) => { if (p.logoSrc === id) p.logoSrc = ""; });
    drawGallery(); drawLogoPreview(); drawPosts(); status(`“${name}” removed from the gallery. Photos already made with it keep it until you update them.`, "ok");
  }
  if (act === "q-logo-all") {
    status("Updating every photo in the queue…");
    try { for (const post of igq.queue) for (const ph of post.images) { ph.logo = igq.schedule.logo.on; ph.frame = igq.schedule.frame.on; await igRefresh(post, ph); } qDirty("All photos updated."); drawPosts(); }
    catch (err) { if (err.message !== "auth") status(err.message, "err"); }
  }
  if (act === "q-now") {
    if (igq.dirty || qSaving) { await qSave(); if (igq.dirty) return status("Couldn't save the latest changes, so it wasn't posted. Try again.", "err"); }
    card.querySelector(".q-now-w").innerHTML = `<span class="confirm">Post this to Instagram now? <button type="button" class="b sm primary" data-act="q-now-yes">Post</button><button type="button" class="b sm" data-act="q-now-no">Cancel</button></span>`;
  }
  if (act === "q-now-no") drawPosts();
  if (act === "q-now-yes") {
    card.querySelector(".q-now-w").innerHTML = `<span class="status">Posting…</span>`;
    try {
      const r = await api("igPostNow", { method: "POST", body: { id: it.id } });
      if (r.waiting) { status(r.waiting, "err"); drawPosts(); return; }
      renderQueue(r.posted?.permalink ? "Posted to Instagram." : "Posted.");
    } catch (err) { if (err.message !== "auth") { status(err.message, "err"); drawPosts(); } }
  }
}

// ---------- issues (flip-through magazines) ----------

async function renderIssues(flash = "") {

async function openIssue(slug) {
  tab = "issues";
  if (!slug) { iss = { slug: "", isNew: true, data: { title: "", dek: "", date: today(), draft: true, pages: [] }, pending: new Map() }; return drawIssue(); }
  app.innerHTML = topBar() + `<main class="wrap c"><div class="panel empty">Loading…</div></main>`;
  try { const { issue } = await api("issue", { query: `&slug=${encodeURIComponent(slug)}` }); iss = { slug, isNew: false, data: { pages: [], ...issue }, pending: new Map() }; drawIssue(); }
  catch (err) { if (err.message !== "auth") renderIssues(); }
}

const issueImg = (u) => { const m = u && u.match(/^\/images\/issues\/[^/]+\/(.+)$/); const p = m && iss?.pending.get(m[1]); return p ? p.preview : shown(u); };

function drawIssue() {
  const d = iss.data;
  app.innerHTML = topBar(`<button class="b" type="button" data-act="tab-issues">${icon("book-open")}<span>All issues</span></button>`) + `
  <main class="wrap c"><form class="panel form" id="iform" autocomplete="off" style="max-width:1000px">
    <span class="label">${iss.isNew ? "New issue" : "Edit issue"}</span>
    <label for="i-title">Title<input id="i-title" value="${esc(d.title || "")}" required></label>
    <label for="i-slug">Web address <span class="hint">${iss.isNew ? "set automatically from the title" : "can't be changed after publishing"}</span>
      <div class="slug-row"><span>zazzimag.com/issues/</span><input id="i-slug" value="${esc(iss.slug)}" ${iss.isNew ? "" : "disabled"}></div></label>
    <label for="i-dek">Summary <span class="hint">optional, shown under the title</span><textarea id="i-dek" style="min-height:64px">${esc(d.dek || "")}</textarea></label>
    <label for="i-date" style="max-width:220px">Date<input id="i-date" type="date" value="${esc(d.date || today())}" required></label>
    <div><span class="label">Pages</span> <span class="hint">· the first page is the cover · change the order with the arrows</span><div class="pages" id="pages"></div>
      <input type="file" id="pg-file" accept="image/*" multiple hidden><div class="uploading" id="uploading"></div></div>
    <label class="switch"><input type="checkbox" id="i-pub" ${d.draft === true ? "" : "checked"}> Published <span class="hint">untick to keep it as a hidden draft</span></label>
    <label class="switch"><input type="checkbox" id="i-pinned" ${d.pinned === true ? "checked" : ""}> Pin to the top of the home page <span class="hint">stays first even when newer stories are added</span></label>
    <div class="save-bar"><button class="b primary" type="submit" id="isave">${icon("save")}<span>Save issue</span></button>
      ${iss.isNew ? "" : `<a class="b" href="/issues/${esc(iss.slug)}/" target="_blank" rel="noopener">${icon("eye")}<span>Open live page</span></a>`}<span class="status" id="st"></span></div>
  </form></main>`;
  const t = document.getElementById("i-title"), sl = document.getElementById("i-slug");
  let touched = !iss.isNew;
  t.oninput = () => { if (iss.isNew && !touched) { iss.slug = slugify(t.value); sl.value = iss.slug; } };
  sl.oninput = () => { touched = true; iss.slug = slugify(sl.value); };
  document.getElementById("pg-file").onchange = async (e) => {
    const files = [...e.target.files]; e.target.value = "";
    syncIssue();
    for (const f of files) {
      const box = document.getElementById("uploading");
      const chip = document.createElement("span"); chip.className = "pill"; chip.textContent = `Uploading ${f.name}…`; box.append(chip);
      try {
        const data = await resize(f, 1800);
        const { sha } = await api("upload", { method: "POST", body: { data } });
        // a lighter copy for phones, so the magazine flips smoothly there
        const { sha: smallSha } = await api("upload", { method: "POST", body: { data: await resize(f, 1080) } });
        let name = `p-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 6)}.jpg`;
        iss.pending.set(name, { sha, smallSha, preview: data });
        iss.data.pages.push({ image: `/images/issues/${iss.slug}/${name}`, caption: "", alt: "" });
        chip.remove(); drawPages();
      } catch (err) { chip.textContent = `Couldn't upload ${f.name}: ${err.message}`; chip.style.color = "var(--accent)"; }
    }
  };
  document.getElementById("iform").onsubmit = (e) => { e.preventDefault(); saveIssue(); };
  document.getElementById("pages").addEventListener("change", (e) => { if (e.target.matches("[data-pshow]")) syncIssue(); });
  drawPages();
}

function drawPages() {
  const ps = iss.data.pages, box = document.getElementById("pages");
  box.innerHTML = ps.map((p, i) => `<div class="page-card${p.hidden ? " is-hidden" : ""}" data-i="${i}">
    <div class="pc-top"><span class="label">${i === 0 ? "Cover" : "Page " + (i + 1)}</span>
      <span class="pc-ctl"><button type="button" class="b" data-act="pg-left" aria-label="Move earlier" ${i === 0 ? "disabled" : ""}>${icon("chevron-left")}</button><button type="button" class="b" data-act="pg-right" aria-label="Move later" ${i === ps.length - 1 ? "disabled" : ""}>${icon("chevron-right")}</button><button type="button" class="b danger" data-act="pg-del" aria-label="Remove page">${icon("trash-2")}</button></span></div>
    <img src="${esc(issueImg(p.image))}" alt="">
    <label>Caption / credit<input data-f="caption" value="${esc(p.caption || "")}"></label>
    <label>Describe the photo<input data-f="alt" value="${esc(p.alt || "")}"></label>
    <label class="showbox"><input type="checkbox" data-pshow ${p.hidden ? "" : "checked"}> Shown on the site</label>
  </div>`).join("") + `<button type="button" class="add-pages" id="add-pages">${icon("image-plus")}<span>Add pages</span><span class="hint">you can pick several photos at once</span></button>`;
  document.getElementById("add-pages").onclick = () => {
    syncIssue();
    if (!iss.slug) { status("Add a title first, so the pages have a folder.", "err"); document.getElementById("i-title").focus(); return; }
    document.getElementById("pg-file").click();
  };
}

function syncIssue() {
  const d = iss.data, v = (id) => document.getElementById(id)?.value ?? "";
  d.title = v("i-title").trim(); d.dek = v("i-dek").trim(); d.date = v("i-date"); d.draft = !document.getElementById("i-pub")?.checked; d.pinned = document.getElementById("i-pinned")?.checked === true;
  document.querySelectorAll(".page-card").forEach((c) => {
    const p = d.pages[+c.dataset.i];
    c.querySelectorAll("[data-f]").forEach((el) => (p[el.dataset.f] = el.value));
    const sh = c.querySelector("[data-pshow]"); if (sh) { if (sh.checked) delete p.hidden; else p.hidden = true; c.classList.toggle("is-hidden", !sh.checked); }
  });
  // if the address changed before saving, keep new uploads pointing at the right folder
  d.pages.forEach((p) => { const m = p.image.match(/^\/images\/issues\/[^/]*\/(.+)$/); if (m && iss.pending.has(m[1])) p.image = `/images/issues/${iss.slug}/${m[1]}`; });
}

async function saveIssue() {
  syncIssue();
  const d = iss.data;
  if (!d.title) return status("Add a title.", "err");
  if (!iss.slug) return status("Add a web address.", "err");
  if (!d.pages.length && !d.draft) return status("Add at least one page, or untick Published to save a draft.", "err");
  const used = [...iss.pending.entries()].filter(([n]) => d.pages.some((p) => p.image.endsWith("/" + n))).map(([name, v]) => ({ name, sha: v.sha, smallSha: v.smallSha }));
  const btn = document.getElementById("isave"); btn.disabled = true; status("Saving…");
  try {
    await api("saveIssue", { method: "POST", body: { slug: iss.slug, isNew: iss.isNew, issue: d, images: used } });
    for (const { name } of used) recent.set(`/images/issues/${iss.slug}/${name}`, iss.pending.get(name).preview);
    renderIssues(d.draft ? `Saved "${d.title}" as a draft.` : `Saved "${d.title}". It will be live on the site in about a minute.`);
  } catch (err) { if (err.message !== "auth") { status(err.message, "err"); btn.disabled = false; } }
}

// ---------- site texts ----------
async function renderTexts() {
  tab = "texts";
  app.innerHTML = topBar() + `<main class="wrap c"><div class="list-head"><div><span class="label">Site texts</span><h1>Wording</h1></div></div><div class="panel empty">Loading…</div></main>`;
  let saved = {};
  try { ({ saved } = await api("settings")); } catch (err) { if (err.message === "auth") return; }
  const get = (k) => k.split(".").reduce((o, x) => (o && typeof o === "object" ? o[x] : undefined), saved);
  const fieldHtml = (f) => {
    const v = get(f.key) ?? f.default, id = "t-" + f.key.replace(".", "-");
    if (f.type === "toggle") return `<div class="f"><label class="showbox" for="${id}"><input type="checkbox" id="${id}" data-key="${f.key}" ${v === "off" ? "" : "checked"}> ${esc(f.label)}</label></div>`;
    const control = f.type === "text"
      ? `<input id="${id}" data-key="${f.key}" value="${esc(v)}">`
      : `<textarea id="${id}" data-key="${f.key}" rows="${f.type === "list" ? 4 : 3}">${esc(v)}</textarea>`;
    return `<div class="f"><label for="${id}">${esc(f.label)}${f.hint ? ` <span class="hint">${esc(f.hint)}</span>` : ""}</label>${control}
      <button type="button" class="def" data-def="${f.key}">Use original text</button></div>`;
  };
  app.querySelector("main").innerHTML = `<div class="list-head"><div><span class="label">Site texts</span><h1>Wording</h1></div>
      <p class="hint" style="max-width:46ch;margin:0">Change any text on the site. In longer texts you can use **bold**, *italic* and [links](https://…). Changes go live about a minute after saving.</p></div>
    <form id="texts" class="texts" autocomplete="off">${SCHEMA.map((g) => `<fieldset><legend>${esc(g.group)}</legend>${g.fields.map(fieldHtml).join("")}</fieldset>`).join("")}</form>
    <div class="texts-bar"><button class="b primary" type="submit" form="texts" id="tsave">${icon("save")}<span>Save texts</span></button><span class="status" id="st"></span></div>`;
  const form = document.getElementById("texts");
  form.addEventListener("click", (e) => {
    const key = e.target.closest("[data-def]")?.dataset.def; if (!key) return;
    const f = SCHEMA.flatMap((g) => g.fields).find((x) => x.key === key);
    form.querySelector(`[data-key="${key}"]`).value = f.default;
    status("Original text restored. Save to apply.");
  });
  form.onsubmit = async (e) => {
    e.preventDefault();
    const values = Object.fromEntries([...form.querySelectorAll("[data-key]")].map((el) => [el.dataset.key, el.type === "checkbox" ? (el.checked ? "on" : "off") : el.value]));
    const btn = document.getElementById("tsave"); btn.disabled = true; status("Saving…");
    try { await api("saveSettings", { method: "POST", body: { values } }); status("Saved. The site will update in about a minute.", "ok"); }
    catch (err) { if (err.message !== "auth") status(err.message, "err"); }
    btn.disabled = false;
  };
}

  if (act === "tab-issues") renderIssues();
  if (act === "toggle-vis") {
    const b = e.target.closest("[data-act=toggle-vis]"), hide = b.dataset.hidden !== "1";
    b.disabled = true; b.querySelector("span").textContent = "Saving…";
    try {
      await api("setVisibility", { method: "POST", body: { type: b.dataset.type, slug: b.dataset.slug, hidden: hide } });
      b.outerHTML = visBtn(b.dataset.type, b.dataset.slug, hide);
      const f = document.getElementById("flash"); if (f) { f.className = "status ok"; f.textContent = `${hide ? "Hidden" : "Shown"}. The site updates in about a minute.`; }
    } catch (err) { if (err.message !== "auth") { b.disabled = false; b.querySelector("span").textContent = "Try again"; const f = document.getElementById("flash"); if (f) { f.className = "status err"; f.textContent = err.message; } } }
  }
  if (act === "new-issue") openIssue();
  if (act === "edit-issue") openIssue(e.target.closest("[data-islug]").dataset.islug);
  if (act === "ask-del-issue") e.target.closest(".row-actions").innerHTML = `<span class="confirm">Delete this issue and its pages? <button class="b danger" type="button" data-act="del-issue">${icon("trash-2")}Delete</button><button class="b" type="button" data-act="tab-issues">Cancel</button></span>`;
  if (act === "del-issue") {
    const row = e.target.closest("[data-islug]"); row.querySelector(".row-actions").innerHTML = `<span class="status">Deleting…</span>`;
    try { await api("deleteIssue", { method: "POST", body: { slug: row.dataset.islug } }); renderIssues("Deleted. The site updates in about a minute."); }
    catch (err) { if (err.message !== "auth") row.querySelector(".row-actions").innerHTML = `<span class="status err">${esc(err.message)}</span>`; }
  }
  const pg = e.target.closest(".page-card"), pgi = pg ? +pg.dataset.i : -1;
  if (act === "pg-left" || act === "pg-right") { syncIssue(); const j = act === "pg-left" ? pgi - 1 : pgi + 1; [iss.data.pages[pgi], iss.data.pages[j]] = [iss.data.pages[j], iss.data.pages[pgi]]; drawPages(); }
  if (act === "pg-del") { syncIssue(); iss.data.pages.splice(pgi, 1); drawPages(); status("Page removed. Save to apply."); }
  if (act === "ig-save") saveInsta();
  if (act === "add-product") { syncProducts(); store.products.push({ name: "", price: "", status: "soon", description: "", link: "", image: "", imageAlt: "", hidden: false }); drawProducts(); [...document.querySelectorAll(".prod [data-f=name]")].pop()?.focus(); }
  const prow = e.target.closest(".prod"), pi = prow ? +prow.dataset.i : -1;
  if (act === "p-photo") { photoFor = pi; document.getElementById("p-file").click(); }
  if (act === "p-up" || act === "p-down") { syncProducts(); const j = act === "p-up" ? pi - 1 : pi + 1; [store.products[pi], store.products[j]] = [store.products[j], store.products[pi]]; drawProducts(); }
  if (act === "p-del") { syncProducts(); store.products.splice(pi, 1); drawProducts(); status("Product removed. Save the store to apply."); }
  if (act === "p-save") saveStore();
  if (act === "back") renderList();
  if (act === "edit") openEditor(slug);
  if (act === "ask-delete") {
    row.querySelector(".row-actions").innerHTML = `<span class="confirm">Delete this article and its photos? <button class="b danger" type="button" data-act="delete">${icon("trash-2")}Delete</button><button class="b" type="button" data-act="cancel">Cancel</button></span>`;
  }
  if (act === "cancel") renderList();
  if (act === "delete") {
    row.querySelector(".row-actions").innerHTML = `<span class="status">Deleting…</span>`;
    try { await api("delete", { method: "POST", body: { slug } }); renderList("Deleted. The site updates in about a minute."); }
    catch (err) { if (err.message !== "auth") row.querySelector(".row-actions").innerHTML = `<span class="status err">${esc(err.message)}</span>`; }
  }
});

// ---------- start ----------
api("me").then((m) => (m.loggedIn ? (goNext() || renderList()) : renderLogin())).catch(() => renderLogin());
</script>
</body>
</html>
